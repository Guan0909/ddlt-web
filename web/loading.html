<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>点定旅途 · 正在生成</title>
<link rel="icon" type="image/svg+xml" href="/brand/logo-icon.svg">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .page { padding: 0 28px 120px; }

  .masthead {
    display: flex; justify-content: space-between; align-items: center;
    padding: 22px 0 0;
  }
  .wordmark { font-family: var(--serif); font-size: 15px; font-weight: 700; letter-spacing: .3em; }

  .hero { padding: 84px 0 0; }
  .hero .display { font-size: 40px; line-height: 1.2; }
  .hero .display em { font-style: italic; font-weight: 400; }
  .hero .meta { margin-top: 20px; font-size: 12.5px; color: var(--ink-2); letter-spacing: .06em; }

  .steps { margin-top: 64px; border-top: .5px solid var(--hairline); }
  .step {
    display: flex; align-items: baseline; gap: 12px;
    padding: 15px 2px; border-bottom: .5px solid var(--hairline);
    color: var(--ink-3); transition: color .3s;
  }
  .step i {
    width: 5px; height: 5px; border-radius: 50%; background: var(--ink-3);
    flex: none; transform: translateY(-2px); transition: background .3s;
  }
  .step b { font-weight: 500; font-size: 14px; }
  .step em { margin-left: auto; font-style: normal; font-size: 12px; color: var(--ink-3); }
  .step.on { color: var(--ink); }
  .step.on i { background: var(--d1); animation: breathe 1.1s ease-in-out infinite; }
  .step.done { color: var(--ink-2); }
  .step.done i { background: var(--d1); animation: none; }
  @keyframes breathe { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

  .foot { margin-top: 40px; font-size: 11px; letter-spacing: .18em; color: var(--ink-3); }

  /* 错误态 */
  .err { padding-top: 84px; }
  .err .display { font-size: 30px; line-height: 1.3; }
  .err .msg { margin-top: 16px; font-size: 13.5px; line-height: 1.9; color: var(--ink-2); }
  .err .dock { display: flex; gap: 14px; align-items: center; }
</style>
</head>
<body>
<div class="page">

  <header class="masthead">
    <div class="wordmark">点定旅途</div>
  </header>

  <!-- 进行态 -->
  <div id="working">
    <div class="hero">
      <h1 class="display">正在为你<br>排这<em>几天。</em></h1>
      <p class="meta" id="meta"></p>
    </div>
    <section class="steps" id="steps">
      <div class="step"><i></i><b>确认起点</b><em></em></div>
      <div class="step"><i></i><b>校验可行性</b><em></em></div>
      <div class="step"><i></i><b>编排每一天</b><em></em></div>
      <div class="step"><i></i><b>计算通勤与时间</b><em></em></div>
    </section>
    <p class="foot">DECIDENOW.ASIA</p>
  </div>

  <!-- 错误态 -->
  <div class="err" id="err" hidden>
    <h2 class="display">这一趟，<br>先<em>停一下。</em></h2>
    <p class="msg" id="errMsg"></p>
    <div class="dock">
      <button class="btn-primary" id="backBtn">返回修改</button>
    </div>
  </div>

</div>
<script src="/assets/engine.bundle.js"></script>
<script src="/assets/app.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const stepEls = [...document.querySelectorAll('#steps .step')];
  const t0 = Date.now();
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function setStage(i, state, detail) {
    const el = stepEls[i];
    if (!el) return;
    el.classList.toggle('on', state === 'on');
    el.classList.toggle('done', state === 'done');
    if (detail) el.querySelector('em').textContent = detail;
  }
  function showError(msg) {
    $('working').hidden = true;
    $('errMsg').textContent = msg;
    $('err').hidden = false;
  }

  $('backBtn').onclick = () => { location.href = '/'; };

  (async () => {
    const req = DDN.loadRequest();
    if (!req || !req.city || !req.origin || !req.origin.name) { location.replace('/'); return; }
    $('meta').textContent = `${req.city} · ${DDN.DAY_CN[(req.days || 3) - 1] || ''}日 · 从 ${req.origin.name} 出发`;

    try {
      // ① 确认起点（裸文本 → 腾讯建议强匹配解析）
      setStage(0, 'on');
      let origin = req.origin;
      let originCity = null;   // 解析出的起点所在城市（腾讯建议的 ad_info）
      if (origin.lng == null) {
        let j = null;
        // region 留空 = 全国提示：不再把「上海地址」限制在默认城市里搜
        try { j = await DDN.cloudPost('searchPoi', { keyword: origin.name, region: '' }, 8000); }
        catch (e) { throw new Error('网络不太稳，地点没有查到。再试一次。'); }
        const list = (j && j.data) || [];
        const q = origin.name.replace(/\s+/g, '');
        const hit = list.find(x => {
          const t = (x.title || '').replace(/\s+/g, '');
          return t && (t.includes(q) || q.includes(t));
        }) || list[0];   // 没命中就取最相关的一条（腾讯按相关度排序），避免为了措辞差异卡住
        if (!hit) throw new Error(`没有找到「${origin.name}」。换个写法，或从建议里选一个。`);
        origin = { name: hit.title, lng: hit.lng, lat: hit.lat };
        originCity = hit.city || null;
      }
      setStage(0, 'done', origin.name);
      await sleep(200);

      // ② 校验可行性（与云端同一引擎规则）
      setStage(1, 'on');
      const normCity = s => String(s || '').replace(/市$/, '').replace(/(自治州|地区|盟)$/, '');
      let city = req.city;
      let spots = await DDN.loadSpots(city);
      if (!spots && originCity) {   // 城市没开通但起点城市开通了：按起点的城市走
        const cov = Object.keys(DDN.SPOT_FILES).find(c => normCity(originCity).startsWith(c));
        if (cov) { city = cov; spots = await DDN.loadSpots(city); }
      }
      if (!spots) throw new Error('这座城市暂未开通，换一座试试。');
      let v = window.Engine.validateInputs(spots, origin, req.days);
      // 起点落在所选城市之外（典型：默认城市 + 别的城市地址）→ 自动切换到装得下它的已开通城市
      // 60 城下不能串行拉 60 个城市数据：先用 cities.json 的中心点粗筛（距离升序，取最近 4 个候选）再逐个校验
      if (!v.ok) {
        const cands = await DDN.candidateCitiesByOrigin(origin, city).catch(() => Object.keys(DDN.SPOT_FILES).filter(c => c !== city).slice(0, 4));
        for (const c of cands) {
          if (c === city) continue;
          const sp = await DDN.loadSpots(c).catch(() => null);
          if (!sp) continue;
          const v2 = window.Engine.validateInputs(sp, origin, req.days);
          if (v2.ok) { city = c; spots = sp; v = v2; break; }
        }
      }
      if (!v.ok) throw new Error(v.message);
      if (city !== req.city) {   // 切城成功：同步请求快照，后续生成/返回都按新城市
        req.city = city;
        DDN.saveRequest(req);
        $('meta').textContent = `${city} · ${DDN.DAY_CN[(req.days || 3) - 1] || ''}日 · 从 ${origin.name} 出发`;
        DDN.toast(`起点在${city}，已按${city}规划`);
      }
      setStage(1, 'done');
      await sleep(200);

      // ③ 编排 + ④ 通勤（云端优先；校验类错误不回退本地，网络类失败才回退）
      setStage(2, 'on');
      let route = null;
      try {
        const j = await DDN.cloudGenRoute({ city: req.city, origin, days: req.days, startDate: req.startDate, startNow: !!req.startNow });
        route = j.route;
        if (j.routeId) route.routeId = j.routeId;
      } catch (e) {
        if (typeof e.code === 'string' && e.code) throw new Error(e.message);   // 校验类错误：直接提示，不绕过
        // 其余（超时/网络/5xx）回退本地引擎
      }
      if (!route) {
        route = window.Engine.genRoute({ spots, origin, days: req.days, startDate: req.startDate, startNow: !!req.startNow, city: req.city });
      }
      if (!route.dayPlans || !route.dayPlans.length) throw new Error('这条路线排不出来。换个起点，或减少天数试试。');
      setStage(2, 'done', `${route.totals.stops} 站`);
      setStage(3, 'on');

      DDN.attachStops(route, spots);
      route.__nowMode = false;
      DDN.saveRoute(route);
      setStage(3, 'done');

      // 最少展示 900ms，避免闪切
      const wait = 900 - (Date.now() - t0);
      setTimeout(() => location.replace('/result'), Math.max(0, wait));
    } catch (err) {
      const wait = 600 - (Date.now() - t0);
      setTimeout(() => showError(err.message || '路线没生成出来。再试一次。'), Math.max(0, wait));
    }
  })();
})();
</script>
</body>
</html>
