<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>点定旅途 · 路线概览海报</title>
<link rel="icon" type="image/svg+xml" href="/brand/logo-icon.svg">
<link rel="stylesheet" href="/assets/style.css">
<style>
  body { background: #101010; }
  .page { background: #101010; display: flex; flex-direction: column; align-items: center; padding: 36px 0 60px; max-width: none; }
  .hint { color: rgba(255,255,255,.42); font-size: 12px; letter-spacing: .18em; margin-bottom: 20px; }
  .poster-view { width: min(430px, 92vw); border-radius: 8px; box-shadow: 0 30px 70px rgba(0,0,0,.55); display: block; }
  .save-btn { margin-top: 26px; display: flex; align-items: center; gap: 8px; background: #FAFBF8; color: #182119; font-size: 14px; font-weight: 600; letter-spacing: .06em; padding: 14px 36px; border-radius: 999px; box-shadow: 0 12px 32px rgba(0,0,0,.45); }
  .save-btn .ic { width: 16px; height: 16px; }
  .tip { color: rgba(255,255,255,.3); font-size: 11px; margin-top: 16px; letter-spacing: .05em; }
  body.embed { background: transparent; overflow: hidden; }
  body.embed .page { padding: 0; background: transparent; }
  body.embed .hint, body.embed .save-btn, body.embed .tip { display: none; }
  body.embed .poster-view { width: 100%; box-shadow: none; border-radius: 10px; }
</style>
</head>
<body>
<div class="page">
  <p class="hint">路线概览海报 · 3:4 · 1440×1920 · 长按可保存</p>
  <canvas id="pc" class="poster-view" width="1440" height="1920"></canvas>
  <img id="pimg" class="poster-view" alt="点定旅途路线海报" style="display:none">
  <button class="save-btn" id="saveBtn"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4v12M6.5 10.5 12 16l5.5-5.5"/><path d="M4 20h16"/></svg>保存图片</button>
  <p class="tip">概览路线 · 景点带图 · 分段距离/时间</p>
</div>
<script src="/assets/engine.bundle.js"></script>
<script src="/assets/app.js"></script>
<script>
(async () => {
  const EMBED = new URLSearchParams(location.search).get('embed') === '1';
  if (EMBED) document.body.classList.add('embed');
  let route = DDN.loadRoute();
  if (!route || !route.dayPlans || !route.dayPlans.length) route = DDN.loadShared();
  if (!route || !route.dayPlans || !route.dayPlans.length) {
    if (!EMBED) location.replace('/index.html');
    return;
  }

  const libSpots = (await DDN.loadSpots(route.city || '成都').catch(() => null)) || [];
  const spotById = {};
  for (const s of libSpots) spotById[s.id] = s;

  const DW = 450, DH = 600;
  const canvas = document.getElementById('pc');
  const ctx = canvas.getContext('2d');
  ctx.scale(canvas.width / DW, canvas.height / DH);

  const SERIF = 'Georgia, "Times New Roman", "Songti SC", "STSong", "SimSun", serif';
  const SANS = '-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif';
  const INK = '#23271F', MUTE = '#8D8A78', HAIR = 'rgba(60,66,52,.16)', PAPER = '#FBF7EC';
  const DAY_COLORS = ['#3B7356', '#3E8E9E', '#B08A3E', '#7A9E43', '#8C6A4A'];

  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function fitText(text, maxW) {
    if (ctx.measureText(text).width <= maxW) return text;
    let t = text;
    while (t.length && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
    return t + '…';
  }
  function setLS(px) { try { ctx.letterSpacing = px + 'px'; } catch (e) {} }

  // ---------- 版面 ----------
  const padX = 28, right = DW - padX, boxW = right - padX;
  const mapX = padX, mapY = 78, mapW = boxW, mapH = 392;   // 地图 78..470
  const bottomY = 484, brandY = 592;

  // ---------- 数据整理 ----------
  const days = route.dayPlans;
  const totalDays = route.days || days.length;
  const stopsOfDay = days.map(dp => {
    const out = [];
    let leg = null;
    for (const it of dp.items) {
      if (it.type === 'commute') leg = it;
      else if (it.type === 'stop') { out.push({ item: it, leg: leg }); leg = null; }
    }
    return out;
  });
  const flat = [];
  stopsOfDay.forEach((arr, di) => arr.forEach((x, si) => flat.push({ item: x.item, leg: x.leg, di: di, si: si, color: DAY_COLORS[di % 5] })));
  const allPts = [{ lng: route.origin.lng, lat: route.origin.lat }];
  for (const f of flat) allPts.push({ lng: f.item.coord.lng, lat: f.item.coord.lat });

  // ---------- 底图（腾讯静态图，失败回退示意） ----------
  const mercY = lat => {
    const s = Math.sin(lat * Math.PI / 180);
    return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI);
  };
  const mercYInv = y => Math.atan(Math.sinh(2 * Math.PI * (0.5 - y))) * 180 / Math.PI;
  function fitZoom(pts, w0, h0, pad) {
    const xs = pts.map(p => (p.lng + 180) / 360), ys = pts.map(p => mercY(p.lat));
    const dx = Math.max.apply(null, xs) - Math.min.apply(null, xs) || 1e-6;
    const dy = Math.max.apply(null, ys) - Math.min.apply(null, ys) || 1e-6;
    const zx = (w0 - pad * 2) / (dx * 256), zy = (h0 - pad * 2) / (dy * 256);
    return Math.max(9, Math.min(13, Math.floor(Math.log2(Math.min(zx, zy)))));
  }
  function fitStaticSize(w0, h0, scale) {
    const f = Math.min(1, 1680 / (w0 * scale), 1200 / (h0 * scale), 900 / w0, 900 / h0);
    return [Math.max(50, Math.round(w0 * f)), Math.max(50, Math.round(h0 * f))];
  }
  const CROP = 32, PAD_EDGE = 20;
  let baseImg = null, zoom = null, cLng = null, cLat = null;
  if (DDN.cloudAvailable()) {
    try {
      const lngs = allPts.map(p => p.lng), lats = allPts.map(p => p.lat);
      cLng = (Math.min.apply(null, lngs) + Math.max.apply(null, lngs)) / 2;
      cLat = (Math.min.apply(null, lats) + Math.max.apply(null, lats)) / 2;
      zoom = fitZoom(allPts, mapW, mapH, PAD_EDGE);
      const worldSize = 256 * Math.pow(2, zoom);
      const req = fitStaticSize(mapW, mapH + CROP, 2);
      const sizeFactor = req[0] / mapW;
      const cLatShifted = mercYInv(mercY(cLat) + (CROP * sizeFactor / 2) / worldSize);
      const j = await DDN.cloudPost('posterImg', {
        center: cLatShifted.toFixed(6) + ',' + cLng.toFixed(6),
        zoom: zoom, size: req[0] + 'x' + req[1], scale: 2,
      }, 15000);
      baseImg = await new Promise((res, rej) => {
        const im = new Image();
        im.onload = () => res(im);
        im.onerror = rej;
        im.src = 'data:image/png;base64,' + j.base64;
      });
    } catch (e) { baseImg = null; }
  }
  function projectRaw(p) {
    if (cLng == null) {
      const lngs = allPts.map(q => q.lng), lats = allPts.map(q => q.lat);
      const minLng = Math.min.apply(null, lngs), maxLng = Math.max.apply(null, lngs);
      const minLat = Math.min.apply(null, lats), maxLat = Math.max.apply(null, lats);
      const kx = Math.cos((minLat + maxLat) / 2 * Math.PI / 180);
      const sx = Math.max((maxLng - minLng) * kx, 1e-6), sy = Math.max(maxLat - minLat, 1e-6);
      const k = Math.min((mapW - 60) / sx, (mapH - 60) / sy);
      return {
        x: mapX + mapW / 2 + (p.lng - (minLng + maxLng) / 2) * kx * k,
        y: mapY + mapH / 2 - (p.lat - (minLat + maxLat) / 2) * k,
      };
    }
    const worldSize = 256 * Math.pow(2, zoom);
    const cx = (cLng + 180) / 360 * worldSize;
    const cy = mercY(cLat) * worldSize;
    return {
      x: (p.lng + 180) / 360 * worldSize - cx + mapW / 2 + mapX,
      y: mercY(p.lat) * worldSize - cy + mapH / 2 + mapY,
    };
  }
  const prj = p => projectRaw(p);
  const O = prj({ lng: route.origin.lng, lat: route.origin.lat });

  // ---------- 景点图片：云端 photoImg 转 base64（跨域图直接画会污染 canvas） ----------
  const photoOf = {};
  try {
    const list = [];
    for (const f of flat) {
      const sp = spotById[f.item.id];
      const u = sp && Array.isArray(sp.photos) && sp.photos[0] ? sp.photos[0] : null;
      if (u) { list.push(u); photoOf[f.item.id] = null; }
    }
    const CHUNK = 12;
    const got = [];
    for (let i = 0; i < list.length; i += CHUNK) {
      const j = await DDN.cloudPost('photoImg', { urls: list.slice(i, i + CHUNK) }, 12000).catch(() => null);
      const arr = (j && j.images) || [];
      for (let k = 0; k < CHUNK; k++) got.push(arr[k] || null);
    }
    let gi = 0;
    for (const f of flat) {
      if (!(f.item.id in photoOf)) continue;
      const rec = got[gi++];
      if (!rec || !rec.b64) continue;
      const im = await new Promise(res => {
        const x = new Image();
        x.onload = () => res(x);
        x.onerror = () => res(null);
        x.src = 'data:' + (rec.type || 'image/jpeg') + ';base64,' + rec.b64;
      });
      if (im) photoOf[f.item.id] = im;
    }
  } catch (e) { /* 图片失败不影响海报 */ }

  // ---------- 纸底 ----------
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, DW, DH);

  // ---------- 头部 ----------
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  const city = route.city || '';
  ctx.fillStyle = INK;
  ctx.font = '700 38px ' + SERIF;
  ctx.fillText(city, padX, 50);
  const cityW = ctx.measureText(city).width;
  ctx.font = '600 8.4px ' + SANS;
  setLS(2.6);
  ctx.fillStyle = MUTE;
  ctx.fillText(DDN.pinyinOf(city) || '', padX + cityW + 8, 47);
  setLS(0);
  ctx.font = '400 8.6px ' + SANS;
  ctx.fillStyle = '#6E6A5E';
  ctx.textAlign = 'right';
  ctx.fillText(DDN.dateRange(route.startDate, totalDays) + ' · ' + DDN.dayCn(totalDays) + '日 · ' + route.totals.stops + ' 站', right, 47);
  ctx.textAlign = 'left';
  ctx.fillStyle = INK;
  ctx.fillRect(padX, 60, boxW, 0.8);

  // ---------- 地图底图 ----------
  const MAP_FILTER = 'saturate(.16) contrast(.72) brightness(1.2)';
  const MAP_WASH = 'rgba(251,247,236,.30)';
  rrect(mapX, mapY, mapW, mapH, 9);
  ctx.fillStyle = '#F3F5EE';
  ctx.fill();
  ctx.save();
  rrect(mapX, mapY, mapW, mapH, 9);
  ctx.clip();
  if (baseImg) {
    try { ctx.filter = MAP_FILTER; } catch (e) {}
    const srcH = baseImg.width * mapH / mapW;
    try { ctx.drawImage(baseImg, 0, 0, baseImg.width, srcH, mapX, mapY, mapW, mapH); } catch (e) {}
    try { ctx.filter = 'none'; } catch (e) {}
    ctx.fillStyle = MAP_WASH;
    ctx.fillRect(mapX, mapY, mapW, mapH);
  } else {
    ctx.fillStyle = '#F4F6EF';
    ctx.fillRect(mapX, mapY, mapW, mapH);
    ctx.strokeStyle = 'rgba(120,128,110,.10)';
    ctx.lineWidth = 0.6;
    for (let x = mapX + 16; x < mapX + mapW - 4; x += 24) { ctx.beginPath(); ctx.moveTo(x, mapY); ctx.lineTo(x, mapY + mapH); ctx.stroke(); }
    for (let y = mapY + 14; y < mapY + mapH - 4; y += 24) { ctx.beginPath(); ctx.moveTo(mapX, y); ctx.lineTo(mapX + mapW, y); ctx.stroke(); }
  }

  // ---------- 概览路线（Catmull-Rom 平滑折线） ----------
  function smoothPath(pts) {
    if (pts.length < 2) return pts.slice();
    const out = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      for (let k = 1; k <= 12; k++) {
        const t = k / 12, t2 = t * t, t3 = t2 * t;
        out.push({
          x: 0.5 * (2 * p1.x + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
          y: 0.5 * (2 * p1.y + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3),
        });
      }
    }
    return out;
  }
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const dayPathsGeo = days.map((dp, di) => {
    const pts = [O].concat(stopsOfDay[di].map(x => prj({ lng: x.item.coord.lng, lat: x.item.coord.lat })));
    return smoothPath(pts);
  });
  for (let di = 0; di < days.length; di++) {
    const path = dayPathsGeo[di];
    if (!path || path.length < 2) continue;
    const color = DAY_COLORS[di % 5];
    const trace = () => { ctx.beginPath(); ctx.moveTo(path[0].x, path[0].y); for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y); };
    trace(); ctx.strokeStyle = 'rgba(253,250,240,.96)'; ctx.lineWidth = 13; ctx.stroke();
    trace(); ctx.strokeStyle = color; ctx.lineWidth = 7; ctx.globalAlpha = 0.95; ctx.stroke(); ctx.globalAlpha = 1;
    trace(); ctx.setLineDash([2.6, 3.2]); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]);
  }

  // ---------- 站点徽章 + 景点图 + 标签 ----------
  const placed = [];
  function overlaps(box) {
    for (const b of placed) {
      if (box.x < b.x + b.w + 2 && box.x + box.w + 2 > b.x && box.y < b.y + b.h + 2 && box.y + box.h + 2 > b.y) return true;
    }
    return false;
  }
  function placeBox(w0, h0, cands) {
    for (const c of cands) {
      const x = Math.max(mapX + 4, Math.min(mapX + mapW - w0 - 4, c.x));
      const y = Math.max(mapY + 4, Math.min(mapY + mapH - h0 - 4, c.y));
      const box = { x: x, y: y, w: w0, h: h0 };
      if (!overlaps(box)) { placed.push(box); return box; }
    }
    const x = Math.max(mapX + 4, Math.min(mapX + mapW - w0 - 4, cands[0].x));
    const y = Math.max(mapY + 4, Math.min(mapY + mapH - h0 - 4, cands[0].y));
    const box = { x: x, y: y, w: w0, h: h0 };
    placed.push(box);
    return box;
  }
  const PH = 30;
  for (let i = 0; i < flat.length; i++) {
    const f = flat[i];
    const pt = prj({ lng: f.item.coord.lng, lat: f.item.coord.lat });
    const color = f.color;
    const im = photoOf[f.item.id] || null;
    const cands = [
      { x: pt.x + 15, y: pt.y - PH - 13 },
      { x: pt.x - PH - 15, y: pt.y - PH - 13 },
      { x: pt.x + 15, y: pt.y + 10 },
      { x: pt.x - PH - 15, y: pt.y + 10 },
      { x: pt.x + 15, y: pt.y - PH / 2 },
      { x: pt.x - PH - 15, y: pt.y - PH / 2 },
    ];
    const box = placeBox(PH, PH + 11, cands);
    // 照片
    if (im) {
      ctx.save();
      ctx.shadowColor = 'rgba(50,46,34,.22)';
      ctx.shadowBlur = 4;
      ctx.shadowOffsetY = 1.4;
      rrect(box.x, box.y, PH, PH, 5);
      ctx.fillStyle = '#FFFDF6';
      ctx.fill();
      ctx.shadowColor = 'transparent';
      rrect(box.x + 1.6, box.y + 1.6, PH - 3.2, PH - 3.2, 4);
      ctx.save();
      ctx.clip();
      const scale = Math.max((PH - 3.2) / im.width, (PH - 3.2) / im.height);
      const dw = im.width * scale, dh = im.height * scale;
      ctx.drawImage(im, box.x + 1.6 + (PH - 3.2 - dw) / 2, box.y + 1.6 + (PH - 3.2 - dh) / 2, dw, dh);
      ctx.restore();
      ctx.restore();
    } else {
      rrect(box.x, box.y, PH, PH, 5);
      ctx.fillStyle = 'rgba(255,253,246,.95)';
      ctx.fill();
      ctx.strokeStyle = HAIR;
      ctx.lineWidth = 0.7;
      ctx.stroke();
    }
    // 名称
    ctx.font = '600 6.2px ' + SANS;
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    const name = fitText(f.item.name, 66);
    ctx.fillStyle = 'rgba(251,247,236,.92)';
    ctx.fillRect(box.x + PH / 2 - ctx.measureText(name).width / 2 - 1.6, box.y + PH + 0.6, ctx.measureText(name).width + 3.2, 9);
    ctx.fillStyle = INK;
    ctx.fillText(name, box.x + PH / 2, box.y + PH + 7.4);
    ctx.textAlign = 'left';
    // 徽章
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, 10.2, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#FFFDF6';
    ctx.lineWidth = 2.2;
    ctx.stroke();
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '700 9.6px ' + SANS;
    ctx.textAlign = 'center';
    ctx.fillText(String(i + 1), pt.x, pt.y + 3.4);
    ctx.textAlign = 'left';
  }
  // 起点
  ctx.beginPath();
  ctx.arc(O.x, O.y, 11, 0, Math.PI * 2);
  ctx.fillStyle = '#23271F';
  ctx.fill();
  ctx.strokeStyle = '#FFFDF6';
  ctx.lineWidth = 2.4;
  ctx.stroke();
  ctx.fillStyle = '#FFFFFF';
  ctx.font = '700 9.6px ' + SANS;
  ctx.textAlign = 'center';
  ctx.fillText('起', O.x, O.y + 3.4);
  ctx.textAlign = 'left';

  // ---------- 分段距离/时间 chip ----------
  function legChip(x, y, text, align) {
    ctx.font = '500 6.1px ' + SANS;
    const tw = ctx.measureText(text).width;
    const cw = tw + 9, ch = 9.6;
    const bx = align === 'right' ? x - cw : x;
    rrect(bx, y - ch / 2, cw, ch, 4.8);
    ctx.fillStyle = 'rgba(255,253,246,.95)';
    ctx.fill();
    ctx.strokeStyle = HAIR;
    ctx.lineWidth = 0.5;
    ctx.stroke();
    ctx.fillStyle = '#5B5A4E';
    ctx.fillText(text, bx + 4.5, y + 2.2);
  }
  for (let di = 0; di < days.length; di++) {
    const arr = stopsOfDay[di];
    for (let si = 0; si < arr.length; si++) {
      const leg = arr[si].leg;
      if (!leg || !isFinite(leg.km) || !isFinite(leg.min)) continue;
      const a = si === 0 ? O : prj({ lng: arr[si - 1].item.coord.lng, lat: arr[si - 1].item.coord.lat });
      const b = prj({ lng: arr[si].item.coord.lng, lat: arr[si].item.coord.lat });
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy);
      if (len < 40) continue;
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const nx = -dy / (len || 1), ny = dx / (len || 1);
      const off = si % 2 === 0 ? 8 : -8;
      legChip(mx + nx * off, my + ny * off, leg.km.toFixed(1) + 'km · ' + Math.round(leg.min) + 'min');
    }
  }

  // ---------- 地图来源标注 ----------
  ctx.font = '400 5.6px ' + SANS;
  ctx.fillStyle = 'rgba(90,90,78,.55)';
  ctx.textAlign = 'right';
  ctx.fillText('地图数据 © 腾讯位置服务', mapX + mapW - 6, mapY + mapH - 6);
  ctx.textAlign = 'left';
  ctx.restore();

  // ---------- 整体概括卡 ----------
  const cardX = padX, cardY = bottomY, cardW = 186, cardH = 94;
  rrect(cardX, cardY, cardW, cardH, 8);
  ctx.fillStyle = 'rgba(255,253,246,.94)';
  ctx.fill();
  ctx.strokeStyle = HAIR;
  ctx.lineWidth = 0.7;
  ctx.stroke();
  ctx.font = '700 8.6px ' + SANS;
  ctx.fillStyle = INK;
  ctx.fillText('整体概括', cardX + 11, cardY + 15);
  const rows = [
    ['总距离', route.totals.km + ' km'],
    ['总耗时', DDN.fmtHour(route.totals.visitMin + route.totals.commuteMin) + ' h'],
    ['站点', route.totals.stops + ' 处'],
    ['天数', totalDays + ' 天'],
  ];
  rows.forEach((r, i) => {
    const ry = cardY + 29 + i * 14;
    ctx.font = '400 7.2px ' + SANS;
    ctx.fillStyle = MUTE;
    ctx.fillText(r[0], cardX + 11, ry);
    ctx.font = '700 8.4px ' + SANS;
    ctx.fillStyle = INK;
    ctx.textAlign = 'right';
    ctx.fillText(r[1], cardX + cardW - 11, ry);
    ctx.textAlign = 'left';
  });

  // ---------- 景点排序（两列） ----------
  const listX = cardX + cardW + 18, listY = cardY + 15, listW = right - listX;
  ctx.font = '700 8.6px ' + SANS;
  ctx.fillStyle = INK;
  ctx.fillText('景点排序', listX, listY);
  const perCol = Math.min(5, Math.ceil(flat.length / 2));
  const lineH = 10.6;
  for (let i = 0; i < flat.length; i++) {
    const col = Math.floor(i / perCol), row = i % perCol;
    if (col > 1) {
      ctx.font = '400 7.4px ' + SANS;
      ctx.fillStyle = MUTE;
      ctx.fillText('… 共 ' + flat.length + ' 站', listX, listY + 24 + perCol * lineH);
      break;
    }
    const x = listX + col * (listW / 2), y = listY + 24 + row * lineH;
    ctx.beginPath();
    ctx.arc(x + 2.4, y - 2.4, 2.2, 0, Math.PI * 2);
    ctx.fillStyle = flat[i].color;
    ctx.fill();
    ctx.font = '500 7.1px ' + SANS;
    ctx.fillStyle = '#3A3E34';
    ctx.fillText(fitText(flat[i].item.name, listW / 2 - 16), x + 7.4, y);
  }

  // ---------- 品牌行 ----------
  ctx.font = '700 8.6px ' + SERIF;
  setLS(2.8);
  ctx.fillStyle = INK;
  ctx.fillText('点定旅途', padX, brandY);
  setLS(0);
  const mapNote = baseImg ? '概览路线 · 真实地图底图 · 每天一条配色路线' : '概览路线 · 每天一条配色路线';
  ctx.font = '400 6.4px ' + SANS;
  ctx.fillStyle = MUTE;
  ctx.textAlign = 'right';
  ctx.fillText(mapNote + ' · DECIDENOW.ASIA', right, brandY);
  ctx.textAlign = 'left';

  // ---------- 导出 ----------
  const img = document.getElementById('pimg');
  img.src = canvas.toDataURL('image/png');
  window.__posterImg = img.src;
  window.__posterReady = true;
  img.onload = () => {
    canvas.style.display = 'none';
    img.style.display = 'block';
  };
  const saveBtnEl = document.getElementById('saveBtn');
  if (saveBtnEl) saveBtnEl.onclick = () => {
    canvas.toBlob(blob => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '点定旅途-' + (route.city || '') + DDN.dayCn(totalDays) + '日路线.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }, 'image/png');
  };
})();
</script>
</body>
</html>
