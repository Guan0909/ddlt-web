<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>点定旅途 · 路线概览海报</title>
<link rel="icon" type="image/svg+xml" href="/brand/logo-icon.svg">
<link rel="apple-touch-icon" href="/brand/avatar-square-512.png">
<meta name="theme-color" content="#FAFBF8">
<link rel="stylesheet" href="/assets/style.css">
<style>
  body { background: #101010; }
  .page { background: #101010; display: flex; flex-direction: column; align-items: center; padding: 36px 0 60px; max-width: none; }
  .hint { color: rgba(255,255,255,.42); font-size: 12px; letter-spacing: .18em; margin-bottom: 20px; }
  .poster-view { width: min(430px, 92vw); border-radius: 8px; box-shadow: 0 30px 70px rgba(0,0,0,.55); display: block; }
  .save-btn { margin-top: 26px; display: flex; align-items: center; gap: 8px; background: #FAFBF8; color: #182119; font-size: 14px; font-weight: 600; letter-spacing: .06em; padding: 14px 36px; border-radius: 999px; box-shadow: 0 12px 32px rgba(0,0,0,.45); }
  .save-btn .ic { width: 16px; height: 16px; }
  .tip { color: rgba(255,255,255,.3); font-size: 11px; margin-top: 16px; letter-spacing: .05em; }
  body.embed { background: transparent; overflow: hidden; }
  body.embed .page { padding: 0; background: transparent; }
  body.embed .hint, body.embed .save-btn, body.embed .tip { display: none; }
  body.embed .poster-view { width: 100%; box-shadow: none; border-radius: 10px; }
</style>
</head>
<body>
<div class="page">
  <p class="hint">路线概览海报 · 3:4 · 1440×1920 · 长按可保存</p>
  <canvas id="pc" class="poster-view" width="1440" height="1920"></canvas>
  <img id="pimg" class="poster-view" alt="点定旅途路线海报" style="display:none">
  <button class="save-btn" id="saveBtn"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4v12M6.5 10.5 12 16l5.5-5.5"/><path d="M4 20h16"/></svg>保存图片</button>
  <p class="tip">概览路线 · 景点带图 · 分段距离/时间</p>
</div>
<script src="/assets/engine.bundle.js"></script>
<script src="/assets/app.js"></script>
<script>
(async () => {
  const EMBED = new URLSearchParams(location.search).get('embed') === '1';
  if (EMBED) document.body.classList.add('embed');
  let route = DDN.loadRoute();
  if (!route || !route.dayPlans || !route.dayPlans.length) route = DDN.loadShared();
  if (!route || !route.dayPlans || !route.dayPlans.length) {
    if (!EMBED) location.replace('/index.html');
    return;
  }

  const libSpots = (await DDN.loadSpots(route.city || '成都').catch(() => null)) || [];
  const spotById = {};
  for (const s of libSpots) spotById[s.id] = s;

  const DW = 450, DH = 600;
  const canvas = document.getElementById('pc');
  const ctx = canvas.getContext('2d');
  ctx.scale(canvas.width / DW, canvas.height / DH);

  const SERIF = 'Georgia, "Times New Roman", "Songti SC", "STSong", "SimSun", serif';
  const SANS = '-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif';
  const INK = '#23271F', MUTE = '#8D8A78', HAIR = 'rgba(60,66,52,.16)', PAPER = '#FBF7EC';
  const DAY_COLORS = ['#3B7356', '#3E8E9E', '#B08A3E', '#7A9E43', '#8C6A4A'];

  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function fitText(text, maxW) {
    if (ctx.measureText(text).width <= maxW) return text;
    let t = text;
    while (t.length && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
    return t + '…';
  }
  function setLS(px) { try { ctx.letterSpacing = px + 'px'; } catch (e) {} }

  // ---------- 版面（新版：整版淡底图 + 蜿蜒路线 + 沿线卡片） ----------
  const padX = 26, right = DW - padX, boxW = right - padX;
  const mapX = 0, mapY = 0, mapW = DW, mapH = DH;   // 底图整版铺满，作为淡化背景
  const brandY = 585;

  // ---------- 数据整理 ----------
  const days = route.dayPlans;
  const totalDays = route.days || days.length;
  const stopsOfDay = days.map(dp => {
    const out = [];
    let leg = null;
    for (const it of dp.items) {
      if (it.type === 'commute') leg = it;
      else if (it.type === 'stop') { out.push({ item: it, leg: leg }); leg = null; }
    }
    return out;
  });
  const flat = [];
  stopsOfDay.forEach((arr, di) => arr.forEach((x, si) => flat.push({ item: x.item, leg: x.leg, di: di, si: si, color: DAY_COLORS[di % 5] })));
  const allPts = [{ lng: route.origin.lng, lat: route.origin.lat }];
  for (const f of flat) allPts.push({ lng: f.item.coord.lng, lat: f.item.coord.lat });

  // ---------- 底图（腾讯静态图，失败回退示意） ----------
  const mercY = lat => {
    const s = Math.sin(lat * Math.PI / 180);
    return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI);
  };
  const mercYInv = y => Math.atan(Math.sinh(2 * Math.PI * (0.5 - y))) * 180 / Math.PI;
  function fitZoom(pts, w0, h0, pad) {
    const xs = pts.map(p => (p.lng + 180) / 360), ys = pts.map(p => mercY(p.lat));
    const dx = Math.max.apply(null, xs) - Math.min.apply(null, xs) || 1e-6;
    const dy = Math.max.apply(null, ys) - Math.min.apply(null, ys) || 1e-6;
    const zx = (w0 - pad * 2) / (dx * 256), zy = (h0 - pad * 2) / (dy * 256);
    return Math.max(9, Math.min(13, Math.floor(Math.log2(Math.min(zx, zy)))));
  }
  function fitStaticSize(w0, h0, scale) {
    const f = Math.min(1, 1680 / (w0 * scale), 1200 / (h0 * scale), 900 / w0, 900 / h0);
    return [Math.max(50, Math.round(w0 * f)), Math.max(50, Math.round(h0 * f))];
  }
  const CROP = 32, PAD_EDGE = 20;
  let baseImg = null, zoom = null, cLng = null, cLat = null;
  if (DDN.cloudAvailable()) {
    try {
      const lngs = allPts.map(p => p.lng), lats = allPts.map(p => p.lat);
      cLng = (Math.min.apply(null, lngs) + Math.max.apply(null, lngs)) / 2;
      cLat = (Math.min.apply(null, lats) + Math.max.apply(null, lats)) / 2;
      zoom = fitZoom(allPts, mapW, mapH, PAD_EDGE);
      const worldSize = 256 * Math.pow(2, zoom);
      const req = fitStaticSize(mapW, mapH + CROP, 2);
      const sizeFactor = req[0] / mapW;
      const cLatShifted = mercYInv(mercY(cLat) + (CROP * sizeFactor / 2) / worldSize);
      const j = await DDN.cloudPost('posterImg', {
        center: cLatShifted.toFixed(6) + ',' + cLng.toFixed(6),
        zoom: zoom, size: req[0] + 'x' + req[1], scale: 2,
      }, 15000);
      baseImg = await new Promise((res, rej) => {
        const im = new Image();
        im.onload = () => res(im);
        im.onerror = rej;
        im.src = 'data:image/png;base64,' + j.base64;
      });
    } catch (e) { baseImg = null; }
  }
  function projectRaw(p) {
    if (cLng == null) {
      const lngs = allPts.map(q => q.lng), lats = allPts.map(q => q.lat);
      const minLng = Math.min.apply(null, lngs), maxLng = Math.max.apply(null, lngs);
      const minLat = Math.min.apply(null, lats), maxLat = Math.max.apply(null, lats);
      const kx = Math.cos((minLat + maxLat) / 2 * Math.PI / 180);
      const sx = Math.max((maxLng - minLng) * kx, 1e-6), sy = Math.max(maxLat - minLat, 1e-6);
      const k = Math.min((mapW - 60) / sx, (mapH - 60) / sy);
      return {
        x: mapX + mapW / 2 + (p.lng - (minLng + maxLng) / 2) * kx * k,
        y: mapY + mapH / 2 - (p.lat - (minLat + maxLat) / 2) * k,
      };
    }
    const worldSize = 256 * Math.pow(2, zoom);
    const cx = (cLng + 180) / 360 * worldSize;
    const cy = mercY(cLat) * worldSize;
    return {
      x: (p.lng + 180) / 360 * worldSize - cx + mapW / 2 + mapX,
      y: mercY(p.lat) * worldSize - cy + mapH / 2 + mapY,
    };
  }
  const prj = p => projectRaw(p);
  const O = prj({ lng: route.origin.lng, lat: route.origin.lat });

  // ---------- 景点图片：云端 photoImg 转 base64（跨域图直接画会污染 canvas） ----------
  const photoOf = {};
  try {
    const items = [];
    const posterUrl = u => {
      let x = String(u).replace(/^http:/, 'https:');
      x = x.replace(/([?&])x-oss-process=[^&]*/g, '$1').replace(/[?&]$/, '');
      return x + (x.indexOf('?') >= 0 ? '&' : '?') + 'x-oss-process=image/resize,w_720';
    };
    for (const f of flat) {
      const sp = spotById[f.item.id];
      const cands = sp && Array.isArray(sp.photos) ? sp.photos.slice(0, 3).map(posterUrl) : [];
      if (cands.length) { items.push({ urls: cands }); }
      else { items.push(null); }
      photoOf[f.item.id] = null;
    }
    const CHUNK = 4;
    const got = [];
    for (let i = 0; i < items.length; i += CHUNK) {
      const part = items.slice(i, i + CHUNK).map(x => x || { urls: [] });
      const j = await DDN.cloudPost('photoImg', { items: part }, 18000).catch(() => null);
      const arr = (j && j.images) || [];
      for (let k = 0; k < CHUNK; k++) got.push(arr[k] || null);
    }
    let gi = 0;
    for (const f of flat) {
      if (!(f.item.id in photoOf)) continue;
      const rec = got[gi++];
      if (!rec || !rec.b64) continue;
      const im = await new Promise(res => {
        const x = new Image();
        x.onload = () => res(x);
        x.onerror = () => res(null);
        x.src = 'data:' + (rec.type || 'image/jpeg') + ';base64,' + rec.b64;
      });
      if (im) photoOf[f.item.id] = im;
    }
  } catch (e) { /* 图片失败不影响海报 */ }

  // ---------- 纸底 + 淡化底图（整版铺满，只做质感） ----------
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, DW, DH);
  if (baseImg) {
    try { ctx.filter = 'saturate(.10) contrast(.58) brightness(1.34)'; } catch (e) {}
    const srcH = baseImg.width * DH / DW;
    try { ctx.drawImage(baseImg, 0, 0, baseImg.width, srcH, 0, 0, DW, DH); } catch (e) {}
    try { ctx.filter = 'none'; } catch (e) {}
    ctx.fillStyle = 'rgba(251,247,236,.88)';
    ctx.fillRect(0, 0, DW, DH);
  }
  // 柔光：右上暖绿、左下青蓝
  try {
    const g1 = ctx.createRadialGradient(DW - 40, 60, 8, DW - 40, 60, 230);
    g1.addColorStop(0, 'rgba(59,115,86,.10)');
    g1.addColorStop(1, 'rgba(59,115,86,0)');
    ctx.fillStyle = g1;
    ctx.fillRect(0, 0, DW, DH);
    const g2 = ctx.createRadialGradient(30, DH - 30, 8, 30, DH - 30, 240);
    g2.addColorStop(0, 'rgba(62,142,158,.09)');
    g2.addColorStop(1, 'rgba(62,142,158,0)');
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, DW, DH);
  } catch (e) {}

  // ---------- 头部 ----------
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  const city = route.city || '';
  ctx.fillStyle = INK;
  ctx.font = '700 34px ' + SERIF;
  ctx.fillText(city, padX, 44);
  const cityW = ctx.measureText(city).width;
  ctx.font = '600 7.4px ' + SANS;
  setLS(2.2);
  ctx.fillStyle = MUTE;
  ctx.fillText(DDN.pinyinOf(city) || '', padX + cityW + 8, 41);
  setLS(0);
  ctx.font = '400 8.2px ' + SANS;
  ctx.fillStyle = '#6E6A5E';
  ctx.textAlign = 'right';
  ctx.fillText(DDN.dateRange(route.startDate, totalDays) + ' · ' + DDN.dayCn(totalDays) + '日 · ' + route.totals.stops + ' 站', right, 42);
  ctx.textAlign = 'left';
  ctx.strokeStyle = 'rgba(60,66,52,.20)';
  ctx.lineWidth = 0.6;
  ctx.beginPath();
  ctx.moveTo(padX, 55);
  ctx.lineTo(right, 55);
  ctx.stroke();
  // 天数图例
  ctx.font = '500 6.6px ' + SANS;
  let lx = padX;
  days.forEach((dp, di) => {
    const color = DAY_COLORS[di % 5];
    ctx.beginPath();
    ctx.arc(lx + 2.6, 68, 2.6, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    const theme = String(dp.label || '').replace(/^[^·]*·\s*/, '') || '路线';
    const txt = 'D' + (di + 1) + ' ' + theme;
    ctx.fillStyle = '#5B5A4E';
    ctx.fillText(txt, lx + 8, 70.6);
    lx += 8 + ctx.measureText(txt).width + 12;
  });
  ctx.font = '400 6.4px ' + SANS;
  ctx.fillStyle = MUTE;
  ctx.textAlign = 'right';
  ctx.fillText(route.totals.km + ' km · 全程约 ' + DDN.fmtHour(route.totals.visitMin + route.totals.commuteMin) + ' h', right, 70.6);
  ctx.textAlign = 'left';

  // ---------- 蜿蜒路线：两列蛇形 + 沿线卡片 ----------
  const CONTENT_TOP = 100, CONTENT_BOTTOM = 548;
  const ordered = flat.slice();
  const N = ordered.length;
  const half = Math.ceil(N / 2);
  const lefts = ordered.slice(0, half);
  const rights = ordered.slice(half).reverse();
  const rowsMax = Math.max(lefts.length, rights.length, 1);
  const rowStep = (CONTENT_BOTTOM - CONTENT_TOP) / rowsMax;
  const LEFT_X = 150, RIGHT_X = 300;
  const posOf = new Map();
  lefts.forEach((f, i) => posOf.set(f, { x: LEFT_X, y: CONTENT_TOP + i * rowStep + rowStep / 2 }));
  rights.forEach((f, i) => posOf.set(f, { x: RIGHT_X, y: CONTENT_BOTTOM - i * rowStep - rowStep / 2 }));
  const startPt = { x: LEFT_X, y: CONTENT_TOP - 14 };
  const pathPts = [startPt].concat(ordered.map(f => posOf.get(f)));
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  function seg(a, b, color, idx) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy) || 1;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const side = idx % 2 === 0 ? 1 : -1;
    const bow = Math.min(9, len * 0.10) * side;
    const cx = mx + (-dy / len) * bow, cy = my + (dx / len) * bow;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.quadraticCurveTo(cx, cy, b.x, b.y);
    ctx.strokeStyle = 'rgba(253,250,240,.96)';
    ctx.lineWidth = 9;
    ctx.stroke();
    ctx.strokeStyle = color;
    ctx.lineWidth = 4.2;
    ctx.stroke();
  }
  for (let i = 0; i < pathPts.length - 1; i++) {
    const target = ordered[Math.min(i, ordered.length - 1)];
    seg(pathPts[i], pathPts[i + 1], target.color, i);
  }
  // 起点标记
  ctx.beginPath();
  ctx.arc(startPt.x, startPt.y, 8.6, 0, Math.PI * 2);
  ctx.fillStyle = '#23271F';
  ctx.fill();
  ctx.strokeStyle = '#FFFDF6';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#FFFFFF';
  ctx.font = '700 8px ' + SANS;
  ctx.textAlign = 'center';
  ctx.fillText('起', startPt.x, startPt.y + 2.8);
  ctx.textAlign = 'left';
  ctx.font = '500 6.6px ' + SANS;
  ctx.fillStyle = MUTE;
  ctx.fillText(fitText(String(route.origin.name || ''), 96), padX, startPt.y + 2.4);

  // ---------- 站点：徽章 + 卡片（照片 + 名称 + 时间） ----------
  const photoSize = Math.max(24, Math.min(40, rowStep - 26));
  ordered.forEach((f, idx) => {
    const pos = posOf.get(f);
    const color = f.color;
    const isLeft = pos.x < DW / 2;
    const textW = 76;
    const cardW = photoSize + 6 + textW;
    const cardX = isLeft ? LEFT_X - 30 - cardW : RIGHT_X + 30;
    const cardY = pos.y - photoSize / 2;
    // 照片
    const im = photoOf[f.item.id] || null;
    const px = isLeft ? cardX + cardW - photoSize : cardX;
    ctx.save();
    ctx.shadowColor = 'rgba(50,46,34,.18)';
    ctx.shadowBlur = 4.5;
    ctx.shadowOffsetY = 1.6;
    rrect(px, cardY, photoSize, photoSize, 5.5);
    ctx.fillStyle = '#FFFDF6';
    ctx.fill();
    ctx.shadowColor = 'transparent';
    if (im) {
      rrect(px + 1.5, cardY + 1.5, photoSize - 3, photoSize - 3, 4.5);
      ctx.save();
      ctx.clip();
      const scale = Math.max((photoSize - 3) / im.width, (photoSize - 3) / im.height);
      const dw = im.width * scale, dh = im.height * scale;
      ctx.drawImage(im, px + 1.5 + (photoSize - 3 - dw) / 2, cardY + 1.5 + (photoSize - 3 - dh) / 2, dw, dh);
      ctx.restore();
    } else {
      ctx.fillStyle = color;
      ctx.font = '700 ' + (photoSize * 0.5) + 'px ' + SERIF;
      ctx.textAlign = 'center';
      ctx.fillText(String(f.item.name || '').slice(0, 1), px + photoSize / 2, cardY + photoSize / 2 + photoSize * 0.17);
      ctx.textAlign = 'left';
    }
    ctx.restore();
    // 名称 + 时间
    const tx = isLeft ? cardX : cardX + photoSize + 6;
    const dayTag = f.si === 0 ? ('D' + (f.di + 1) + ' ') : '';
    ctx.font = '600 7.6px ' + SANS;
    ctx.fillStyle = INK;
    ctx.fillText(fitText(dayTag + f.item.name, textW - 2), tx, cardY + photoSize * 0.52);
    ctx.font = '400 6.2px ' + SANS;
    ctx.fillStyle = MUTE;
    const timeTxt = (f.item.arr || '') + (f.leg && f.leg.km ? ' · ' + f.leg.km.toFixed(1) + 'km' : '');
    ctx.fillText(fitText(timeTxt, textW - 2), tx, cardY + photoSize * 0.52 + 9);
    // 徽章 + 引线
    const bx = pos.x, by = pos.y;
    const edgeX = isLeft ? cardX + cardW + 3 : cardX - 3;
    ctx.strokeStyle = 'rgba(60,66,52,.28)';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(bx + (isLeft ? -8.2 : 8.2), by);
    ctx.lineTo(edgeX, by);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(bx, by, 8.4, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#FFFDF6';
    ctx.lineWidth = 1.8;
    ctx.stroke();
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '700 8.4px ' + SANS;
    ctx.textAlign = 'center';
    ctx.fillText(String(f.si + 1), bx, by + 3);
    ctx.textAlign = 'left';
  });

  // ---------- 页脚 ----------
  ctx.font = '700 8.2px ' + SERIF;
  setLS(2.6);
  ctx.fillStyle = INK;
  ctx.fillText('点定旅途', padX, brandY);
  setLS(0);
  ctx.font = '400 6.2px ' + SANS;
  ctx.fillStyle = MUTE;
  ctx.textAlign = 'right';
  ctx.fillText('概览路线（非真实导航）· DECIDENOW.ASIA', right, brandY);
  ctx.font = '400 5.4px ' + SANS;
  ctx.fillStyle = 'rgba(90,90,78,.55)';
  ctx.fillText(baseImg ? '底图 © 腾讯位置服务' : '', right, brandY + 8);
  ctx.textAlign = 'left';
  // ---------- 导出 ----------
  const img = document.getElementById('pimg');
  img.src = canvas.toDataURL('image/png');
  window.__posterImg = img.src;
  window.__posterReady = true;
  img.onload = () => {
    canvas.style.display = 'none';
    img.style.display = 'block';
  };
  const saveBtnEl = document.getElementById('saveBtn');
  if (saveBtnEl) saveBtnEl.onclick = () => {
    canvas.toBlob(blob => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '点定旅途-' + (route.city || '') + DDN.dayCn(totalDays) + '日路线.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }, 'image/png');
  };
})();
</script>
</body>
</html>
