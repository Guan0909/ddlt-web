<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>分享 · 点定旅途路线</title>
<link rel="icon" type="image/svg+xml" href="/brand/logo-icon.svg">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .page { padding-bottom: 130px; }
  .vis-note { padding: 20px 28px 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.6; }
  .share-hero { padding: 34px 28px 0; }
  .from {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 11px; letter-spacing: .16em; color: var(--ink-2);
    padding-bottom: 8px; border-bottom: .5px solid var(--hairline);
  }
  .from .ic { width: 13px; height: 13px; }
  .share-hero h1 { font-family: var(--serif); font-size: 38px; margin-top: 26px; line-height: 1.15; }
  .share-hero h1 em { font-style: italic; font-weight: 400; }
  .share-hero .meta { font-size: 12.5px; color: var(--ink-2); margin-top: 12px; letter-spacing: .03em; }

  .stats-line {
    display: flex; gap: 0; margin: 26px 28px 0; padding: 13px 0;
    border-top: .5px solid var(--hairline); border-bottom: .5px solid var(--hairline);
  }
  .stats-line div { flex: 1; text-align: center; }
  .stats-line div + div { border-left: .5px solid var(--hairline); }
  .stats-line b { font-family: var(--serif); font-size: 18px; display: block; }
  .stats-line span { font-size: 9.5px; letter-spacing: .14em; color: var(--ink-3); }

  .day-group { padding: 0 28px; }
  .day-label {
    display: flex; align-items: baseline; gap: 8px;
    margin: 26px 0 4px;
  }
  .day-label b { font-family: var(--serif); font-size: 15px; }
  .day-label span { font-size: 10.5px; letter-spacing: .12em; color: var(--ink-3); }
  .day-label i { width: 18px; height: 2.5px; border-radius: 2px; align-self: center; }

  .mini {
    display: flex; align-items: baseline; gap: 12px;
    padding: 11px 2px; border-bottom: .5px solid var(--hairline);
  }
  .mini:last-child { border-bottom: none; }
  .mini .t { font-size: 11px; color: var(--ink-3); width: 72px; flex: none; font-variant-numeric: tabular-nums; }
  .mini .n { font-size: 14.5px; font-weight: 600; flex: 1; }
  .mini .lv {
    font-size: 9.5px; font-weight: 600; letter-spacing: .06em; color: var(--d2, #3B7356);
    border: .5px solid currentColor; border-radius: 999px; padding: 0 4px; margin-left: 4px;
  }
  .mini .g { font-size: 10.5px; color: var(--ink-3); max-width: 40%; text-align: right; }

  .brand {
    margin: 44px 28px 0; padding-top: 18px;
    border-top: .5px solid var(--hairline);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .brand b { font-family: var(--serif); font-size: 14px; letter-spacing: .28em; }
  .brand span { font-size: 10.5px; color: var(--ink-3); }

  .dock-row { display: flex; align-items: center; gap: 8px; }
  .dock-row .btn-primary { flex: 1; }
  .share-map { display: block; width: 100%; height: auto; margin: 0; border-radius: 10px; background: #F3F5F0; }
  .share-poster { padding: 22px 28px 0; }
  .poster-title { font-family: var(--serif); font-size: 15px; color: var(--ink); margin-bottom: 10px; letter-spacing: .04em; }
  .poster-frame { border-radius: 10px; overflow: hidden; background: #F3F5F0; }
  .poster-frame iframe { width: 100%; border: 0; display: block; }
  .poster-actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .poster-hint { font-size: 11px; color: var(--ink-3); }
  .share-skeleton { margin: 14px 0 0; height: 150px; border-radius: 10px; background: linear-gradient(90deg, #F3F5F0 25%, #EAEDE6 37%, #F3F5F0 63%); background-size: 400% 100%; animation: sk 1.2s ease-in-out infinite; }
  @keyframes sk { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

  /* 路线 / 海报 左右切换 */
  .tabs { display: flex; gap: 6px; margin: 18px 28px 0; padding: 4px; border: .5px solid var(--hairline); border-radius: 999px; background: rgba(255,255,255,.6); }
  .tab { flex: 1; min-height: 38px; border-radius: 999px; font-size: 13.5px; letter-spacing: .06em; color: var(--ink-3); }
  .tab.on { background: var(--ink); color: var(--paper); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .share-poster { padding: 16px 16px 0; }
  .poster-map { padding: 16px 16px 24px; }
  .poster-map .share-map { margin: 0; }
  .poster-hint { font-size: 11px; color: var(--ink-3); text-align: center; margin-top: 10px; }
  .route-save-hint { font-size: 11px; color: var(--ink-3); text-align: center; margin-top: 14px; }
</style>
</head>
<body>
<div class="page" id="page">

  <div class="vis-note">这是一条只读分享链接，任何拿到链接的人都能查看</div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-tab="route">路线</button>
    <button class="tab" data-tab="poster">海报</button>
  </div>

  <div class="tab-panel active" id="panelRoute"><div id="content"></div></div>
  <div class="tab-panel" id="panelPoster"></div>

  <div class="dock" id="dock" hidden>
    <button class="btn-primary" id="saveBtn">保存图片</button>
  </div>

</div>
<script src="/assets/engine.bundle.js"></script>
<script src="/assets/app.js"></script>
<script>
(async () => {
  // 读取顺序：URL ?id（云端 routeGet，128 位不可猜测 ID）→ localStorage 兜底
  const id = new URLSearchParams(location.search).get('id') ||
    (location.pathname.match(/\/share\/([0-9a-f]{32})/) || [])[1];
  let route = null;
  if (id && DDN.cloudAvailable()) {
    try {
      const j = await DDN.cloudPost('routeGet', { id }, 6000);
      route = j.route;
    } catch (e) { /* 云端读取失败走兜底 */ }
  }
  if (!route) route = DDN.loadShared();

  const content = document.getElementById('content');
  const dock = document.getElementById('dock');

  if (!route || !route.dayPlans) {
    const hero = DDN.el('div', 'share-hero');
    const h = DDN.el('h1');
    h.appendChild(document.createTextNode('这条分享，'));
    h.appendChild(DDN.el('br'));
    const em = DDN.el('em', null, '在这里打不开。');
    h.appendChild(em);
    hero.appendChild(h);
    hero.appendChild(DDN.el('div', 'meta', '链接可能已失效，或还没有在本机生成过分享。'));
    content.appendChild(hero);
    return;
  }

  const spots = (await DDN.loadSpots(route.city || '成都').catch(() => null)) || [];
  const spotById = sid => spots.find(s => s.id === sid) || null;

  document.title = `分享 · ${route.city || ''}${DDN.dayCn(route.days)}日路线`;

  // hero
  const hero = DDN.el('div', 'share-hero');
  const from = DDN.el('div', 'from');
  from.appendChild(DDN.icon('share', 'ic'));
  from.appendChild(document.createTextNode('好友分享的路线'));
  hero.appendChild(from);
  const h1 = DDN.el('h1');
  h1.appendChild(document.createTextNode(`${route.city || ''}，`));
  h1.appendChild(DDN.el('br'));
  h1.appendChild(DDN.el('em', null, `${DDN.dayCn(route.days)}日漫游。`));
  hero.appendChild(h1);
  hero.appendChild(DDN.el('div', 'meta',
    `${DDN.dateRange(route.startDate, route.days)} · 从${route.origin.name}出发，晚上回到这里`));
  content.appendChild(hero);

  // stats-line
  const sl = DDN.el('div', 'stats-line');
  const cell = (v, l) => {
    const d = DDN.el('div');
    d.appendChild(DDN.el('b', null, v));
    d.appendChild(DDN.el('span', null, l));
    return d;
  };
  sl.appendChild(cell(String(route.days), '天'));
  sl.appendChild(cell(String(route.totals.stops), '站点'));
  sl.appendChild(cell(String(route.totals.km), '公里'));
  sl.appendChild(cell(DDN.fmtHour(route.totals.visitMin) + 'h', '游览'));
  content.appendChild(sl);

  // 路线缩略图（纯前端 SVG）：放在海报页、海报下方
  function drawRouteMap(host) {
    try {
      const pts = [{ lng: route.origin.lng, lat: route.origin.lat }];
      (route.dayPlans || []).forEach(dp => (dp.items || []).forEach(it => {
        if (it.type === 'stop' && it.coord) pts.push({ lng: it.coord.lng, lat: it.coord.lat });
      }));
      if (pts.length < 2) return;
      const W = 396, H = 150, PAD = 18;
      const lngs = pts.map(p => p.lng), lats = pts.map(p => p.lat);
      const minLng = Math.min.apply(null, lngs), maxLng = Math.max.apply(null, lngs);
      const minLat = Math.min.apply(null, lats), maxLat = Math.max.apply(null, lats);
      const sx = (maxLng - minLng) || 1e-6, sy = (maxLat - minLat) || 1e-6;
      const k = Math.min((W - PAD * 2) / sx, (H - PAD * 2) / sy);
      const ox = (W - sx * k) / 2, oy = (H - sy * k) / 2;
      const xy = p => [ox + (p.lng - minLng) * k, H - (oy + (p.lat - minLat) * k)];
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      svg.setAttribute('class', 'share-map');
      const bg = document.createElementNS(ns, 'rect');
      bg.setAttribute('width', W); bg.setAttribute('height', H); bg.setAttribute('rx', 10);
      bg.setAttribute('fill', '#F3F5F0');
      svg.appendChild(bg);
      (route.dayPlans || []).forEach(dp => {
        const seq = [{ lng: route.origin.lng, lat: route.origin.lat }].concat(
          (dp.items || []).filter(it => it.type === 'stop' && it.coord).map(it => ({ lng: it.coord.lng, lat: it.coord.lat })));
        if (seq.length < 2) return;
        const poly = document.createElementNS(ns, 'polyline');
        poly.setAttribute('points', seq.map(p => xy(p).join(',')).join(' '));
        poly.setAttribute('fill', 'none');
        poly.setAttribute('stroke', dp.color || '#3B7356');
        poly.setAttribute('stroke-width', '2.2');
        poly.setAttribute('stroke-linecap', 'round');
        poly.setAttribute('stroke-linejoin', 'round');
        poly.setAttribute('opacity', '.85');
        svg.appendChild(poly);
        seq.slice(1).forEach(p => {
          const c = document.createElementNS(ns, 'circle');
          const q = xy(p);
          c.setAttribute('cx', q[0]); c.setAttribute('cy', q[1]); c.setAttribute('r', 3);
          c.setAttribute('fill', dp.color || '#3B7356');
          svg.appendChild(c);
        });
      });
      const oq = xy({ lng: route.origin.lng, lat: route.origin.lat });
      const oc = document.createElementNS(ns, 'circle');
      oc.setAttribute('cx', oq[0]); oc.setAttribute('cy', oq[1]); oc.setAttribute('r', 4.5);
      oc.setAttribute('fill', '#182119');
      oc.setAttribute('stroke', '#FAFBF8'); oc.setAttribute('stroke-width', '2');
      svg.appendChild(oc);
      host.appendChild(svg);
    } catch (e) {}
  }

  // 按日分组 mini 行
  const group = DDN.el('div', 'day-group');
  for (const dp of route.dayPlans) {
    const label = DDN.el('div', 'day-label');
    const bar = DDN.el('i');
    bar.style.background = dp.color;
    label.appendChild(bar);
    label.appendChild(DDN.el('b', null, `D${dp.day} · ${dp.label}`));
    label.appendChild(DDN.el('span', null, `${dp.stats.stops} 站 · ${dp.stats.km} km`));
    group.appendChild(label);
    for (const it of dp.items) {
      if (it.type !== 'stop') continue;
      const mini = DDN.el('div', 'mini');
      mini.appendChild(DDN.el('span', 't', `${it.arr}–${it.dep}`));
      mini.appendChild(DDN.el('span', 'n', it.name));
      const spot = spotById(it.id);
      if (spot && spot.a_level) mini.appendChild(DDN.el('span', 'lv', String(spot.a_level).toUpperCase()));
      const g = spot && (spot.tags || [])[0] ? spot.tags[0] : String(it.reason || '').slice(0, 10);
      if (g) mini.appendChild(DDN.el('span', 'g', g));
      group.appendChild(mini);
    }
  }
  content.appendChild(group);

  // ---------- 路线海报（可视化路线）：内嵌海报页渲染，复用同一套绘制逻辑 ----------
  try { DDN.saveShared(route); } catch (e) {}
  const posterSec = DDN.el('section', 'share-poster');
  posterSec.appendChild(DDN.el('div', 'poster-title', '路线海报'));
  const holder = DDN.el('div', 'poster-frame');
  const frame = document.createElement('iframe');
  frame.src = '/poster.html?embed=1';
  frame.setAttribute('scrolling', 'no');
  frame.setAttribute('title', '路线海报');
  holder.appendChild(frame);
  posterSec.appendChild(holder);
  posterSec.appendChild(DDN.el('div', 'poster-hint', '长按图片可直接保存到相册'));
  document.getElementById('panelPoster').appendChild(posterSec);
  const mapBox = DDN.el('div', 'poster-map');
  drawRouteMap(mapBox);
  document.getElementById('panelPoster').appendChild(mapBox);
  const fitFrame = () => {
    const w = holder.clientWidth || 380;
    frame.style.height = Math.round(w * 4 / 3) + 'px';
  };
  frame.addEventListener('load', fitFrame);
  window.addEventListener('resize', fitFrame);
  setTimeout(fitFrame, 80);


  // ---------- 路线 / 海报 左右切换 ----------
  const panelRoute = document.getElementById('panelRoute');
  const panelPoster = document.getElementById('panelPoster');
  let activeTab = 'route';
  function setTab(tab) {
    activeTab = tab;
    [...document.querySelectorAll('.tabs .tab')].forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    panelRoute.classList.toggle('active', tab === 'route');
    panelPoster.classList.toggle('active', tab === 'poster');
    if (tab === 'poster') setTimeout(fitFrame, 80);
  }
  [...document.querySelectorAll('.tabs .tab')].forEach(b => { b.onclick = () => setTab(b.dataset.tab); });
  (function swipeTabs() {
    let sx = 0, sy = 0;
    const page = document.getElementById('page');
    page.addEventListener('touchstart', e => { if (e.touches.length === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } }, { passive: true });
    page.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - sx;
      const dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      setTab(dx < 0 ? 'poster' : 'route');
    }, { passive: true });
  })();
  function downloadUrl(url, filename) {
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
  function savePosterImage() {
    let src = null;
    try { src = frame.contentWindow && frame.contentWindow.__posterImg; } catch (e) {}
    if (!src) {
      try { const im = frame.contentDocument.getElementById('pimg'); if (im && im.src && im.src.length > 100) src = im.src; } catch (e) {}
    }
    if (!src) { DDN.toast('海报还在生成，稍等一下'); return; }
    downloadUrl(src, '点定旅途-' + (route.city || '') + DDN.dayCn(route.days) + '日路线海报.png');
  }
  // 路线 tab：把页面信息重绘成一张可下载的图片
  function saveRouteCard() {
    const W = 1080, PAD = 72;
    const INK = '#182119', INK2 = '#5C6157', MUTE = '#9C998C', HAIR = '#E3E8E0', PAPER = '#FAFBF8';
    const F = {
      title: '700 62px Georgia, "Songti SC", "STSong", serif',
      meta: '400 26px -apple-system, "PingFang SC", sans-serif',
      day: '700 32px Georgia, "Songti SC", serif',
      daySub: '400 22px -apple-system, "PingFang SC", sans-serif',
      num: '700 50px Georgia, "Songti SC", serif',
      numLabel: '400 20px -apple-system, "PingFang SC", sans-serif',
      time: '400 24px -apple-system, "PingFang SC", sans-serif',
      name: '600 30px -apple-system, "PingFang SC", sans-serif',
      tag: '400 22px -apple-system, "PingFang SC", sans-serif',
      brand: '700 24px Georgia, "Songti SC", serif',
      brandSub: '400 20px -apple-system, "PingFang SC", sans-serif',
    };
    const days = (route.dayPlans || []).map(dp => ({ dp, stops: (dp.items || []).filter(i => i.type === 'stop') }));
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = 4200;   // 临时画布：画完按实际内容裁剪
    const ctx = cv.getContext('2d');
    ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, cv.height);
    let y = PAD + 60;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = INK; ctx.font = F.title;
    ctx.fillText(String(route.city || ''), PAD, y);
    ctx.textAlign = 'right'; ctx.font = F.meta; ctx.fillStyle = INK2;
    ctx.fillText(DDN.dateRange(route.startDate, route.days) + ' · ' + DDN.dayCn(route.days) + '日漫游', W - PAD, y - 8);
    ctx.textAlign = 'left';
    y += 34;
    ctx.font = F.meta; ctx.fillStyle = INK2;
    ctx.fillText('从' + route.origin.name + '出发 · 晚上回到这里', PAD, y);
    y += 26;
    ctx.strokeStyle = HAIR; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(W - PAD, y); ctx.stroke();
    y += 54;
    const stats = [[String(route.days), '天'], [String(route.totals.stops), '站点'], [String(route.totals.km), '公里'], [DDN.fmtHour(route.totals.visitMin) + 'h', '游览']];
    const cellW = (W - PAD * 2) / stats.length;
    stats.forEach((s, i) => {
      const cx = PAD + cellW * i + cellW / 2;
      ctx.textAlign = 'center';
      ctx.font = F.num; ctx.fillStyle = INK; ctx.fillText(s[0], cx, y + 26);
      ctx.font = F.numLabel; ctx.fillStyle = MUTE; ctx.fillText(s[1], cx, y + 62);
      if (i > 0) { ctx.strokeStyle = HAIR; ctx.beginPath(); ctx.moveTo(PAD + cellW * i, y - 18); ctx.lineTo(PAD + cellW * i, y + 70); ctx.stroke(); }
    });
    ctx.textAlign = 'left';
    y += 108;
    drawCardMap(ctx, PAD, y, W - PAD * 2, 320, days);
    y += 320 + 52;
    for (const b of days) {
      ctx.fillStyle = b.dp.color || '#3B7356';
      ctx.fillRect(PAD, y - 24, 28, 4);
      ctx.font = F.day; ctx.fillStyle = INK;
      ctx.fillText('D' + b.dp.day + ' · ' + b.dp.label, PAD + 42, y);
      ctx.font = F.daySub; ctx.fillStyle = MUTE; ctx.textAlign = 'right';
      ctx.fillText((b.dp.stats || {}).stops + ' 站 · ' + (b.dp.stats || {}).km + ' km', W - PAD, y);
      ctx.textAlign = 'left';
      y += 46;
      for (const it of b.stops) {
        ctx.font = F.time; ctx.fillStyle = MUTE;
        ctx.fillText(it.arr + '–' + it.dep, PAD, y);
        ctx.font = F.name; ctx.fillStyle = INK;
        ctx.fillText(it.name, PAD + 250, y);
        const sp = spotById(it.id);
        const tag = (sp && sp.a_level) ? String(sp.a_level).toUpperCase() + ' 景区' : String((sp && (sp.tags || [])[0]) || '');
        if (tag) { ctx.font = F.tag; ctx.fillStyle = MUTE; ctx.textAlign = 'right'; ctx.fillText(tag, W - PAD, y); ctx.textAlign = 'left'; }
        y += 26;
        ctx.strokeStyle = HAIR; ctx.beginPath(); ctx.moveTo(PAD, y - 8); ctx.lineTo(W - PAD, y - 8); ctx.stroke();
        y += 40;
      }
      y += 20;
    }
    ctx.font = F.brand; ctx.fillStyle = INK;
    ctx.fillText('点定旅途', PAD, y);
    ctx.font = F.brandSub; ctx.fillStyle = MUTE; ctx.textAlign = 'right';
    ctx.fillText('DECIDENOW.ASIA · 从任何地点，生成你的路线', W - PAD, y);
    ctx.textAlign = 'left';
    // 按实际内容高度裁剪
    const outH = Math.round(y + PAD);
    const out = document.createElement('canvas');
    out.width = W; out.height = outH;
    out.getContext('2d').drawImage(cv, 0, 0, W, outH, 0, 0, W, outH);
    out.toBlob(blob => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      downloadUrl(url, '点定旅途-' + (route.city || '') + DDN.dayCn(route.days) + '日路线.png');
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }, 'image/png');
  }
  function drawCardMap(ctx, x, y, w, h, days) {
    // 坐标两种形态：数组 [lng,lat]（库）或 {lng,lat}（路线 item）
    const norm = c => {
      if (!c) return null;
      if (Array.isArray(c)) {
        const lng = +c[0], lat = +c[1];
        return isFinite(lng) && isFinite(lat) ? { lng: lng, lat: lat } : null;
      }
      const lng = +c.lng, lat = +c.lat;
      return isFinite(lng) && isFinite(lat) ? { lng: lng, lat: lat } : null;
    };
    const stopPt = it => {
      const sp = spotById(it.id);
      return norm(it.coord) || norm(sp && sp.coord);
    };
    const pts = [{ lng: +route.origin.lng, lat: +route.origin.lat }];
    for (const b of days) for (const it of b.stops) {
      const p = stopPt(it);
      if (p) pts.push(p);
    }
    ctx.fillStyle = '#F3F5F0';
    const r = 18;
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();
    if (pts.length < 2) return;
    const PAD = 42;
    const lngs = pts.map(p => p.lng), lats = pts.map(p => p.lat);
    const minLng = Math.min.apply(null, lngs), maxLng = Math.max.apply(null, lngs);
    const minLat = Math.min.apply(null, lats), maxLat = Math.max.apply(null, lats);
    const sx = (maxLng - minLng) || 1e-6, sy = (maxLat - minLat) || 1e-6;
    const k = Math.min((w - PAD * 2) / sx, (h - PAD * 2) / sy);
    const ox = x + (w - sx * k) / 2, oy = y + (h - sy * k) / 2;
    const xy = p => [ox + (p.lng - minLng) * k, y + h - ((p.lat - minLat) * k + (h - sy * k) / 2)];
    days.forEach(b => {
      const seq = [{ lng: +route.origin.lng, lat: +route.origin.lat }];
      for (const it of b.stops) {
        const p = stopPt(it);
        if (p) seq.push(p);
      }
      if (seq.length < 2) return;
      ctx.strokeStyle = b.dp.color || '#3B7356';
      ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      seq.forEach((p, i) => { const q = xy(p); if (i === 0) ctx.moveTo(q[0], q[1]); else ctx.lineTo(q[0], q[1]); });
      ctx.stroke();
      ctx.fillStyle = b.dp.color || '#3B7356';
      seq.slice(1).forEach(p => { const q = xy(p); ctx.beginPath(); ctx.arc(q[0], q[1], 9, 0, Math.PI * 2); ctx.fill(); });
    });
    const oq = xy({ lng: route.origin.lng, lat: route.origin.lat });
    ctx.fillStyle = '#182119';
    ctx.beginPath(); ctx.arc(oq[0], oq[1], 13, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#FAFBF8'; ctx.lineWidth = 5; ctx.stroke();
  }
  // ---------- 保存图片 ----------
  dock.hidden = false;
  const saveBtnEl = document.getElementById('saveBtn');
  if (saveBtnEl) saveBtnEl.onclick = () => { if (activeTab === 'poster') savePosterImage(); else saveRouteCard(); };
})();
</script>
