<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>点定旅途 · 起点</title>
<link rel="icon" type="image/svg+xml" href="/brand/logo-icon.svg">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .page { padding: 0 28px 120px; }

  .masthead {
    display: flex; justify-content: space-between; align-items: center;
    padding: 22px 0 0;
  }
  .wordmark { font-family: var(--serif); font-size: 15px; font-weight: 700; letter-spacing: .3em; }
  .city {
    display: flex; align-items: center; gap: 5px;
    font-size: 13px; font-weight: 500; color: var(--ink);
    padding-bottom: 2px; border-bottom: .5px solid var(--ink);
  }
  .city .ic { width: 14px; height: 14px; }

  .hero { padding: 72px 0 0; }
  .hero .display { font-size: 44px; line-height: 1.18; }
  .hero .display em { font-style: italic; font-weight: 400; }
  .hero .sub { margin-top: 18px; max-width: 260px; }

  .search {
    margin-top: 52px;
    display: flex; align-items: center; gap: 12px;
    padding: 16px 2px 14px;
    border-bottom: 1px solid var(--ink);
  }
  .search .ic { color: var(--ink-3); }
  .search input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 16.5px; font-family: var(--font); color: var(--ink);
  }
  .search input::placeholder { color: var(--ink-3); }
  .locate {
    display: flex; align-items: center; gap: 5px;
    font-size: 13px; font-weight: 500; color: var(--ink-2);
  }
  .locate .ic { width: 15px; height: 15px; color: var(--ink-2); }

  .days { margin-top: 48px; }
  .days-row {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-top: 18px;
  }
  .days-row button {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-family: var(--serif); font-size: 26px; color: var(--ink-3);
    padding-bottom: 10px; position: relative; transition: color .15s;
  }
  .days-row button small { font-family: var(--font); font-size: 10px; letter-spacing: .2em; }
  .days-row button.on { color: var(--ink); }
  .days-row button.on::after {
    content: ""; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 4px; height: 4px; border-radius: 50%; background: var(--ink);
  }

  .note { margin-top: 52px; padding-top: 18px; border-top: .5px solid var(--hairline); }
  .note p { font-size: 12.5px; color: var(--ink-2); line-height: 1.8; }

  .foot { margin-top: 44px; font-size: 11px; letter-spacing: .18em; color: var(--ink-3); }
  .suggest .sl { display: flex; align-items: center; gap: 7px; padding: 11px 13px; font-size: 12.5px; color: var(--ink-3); }
  .suggest .sl i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--hairline); border-top-color: var(--ink-3); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .suggest button .tp { margin-left: 6px; font-size: 9.5px; letter-spacing: .06em; color: var(--ink-3); border: .5px solid var(--hairline); border-radius: 999px; padding: 1px 5px; flex: none; }
  .suggest button small.away { color: #9C998C; }
  .drawer-search { width: 100%; box-sizing: border-box; margin: 2px 0 10px; padding: 10px 12px; border: .5px solid var(--hairline); border-radius: 10px; font-family: var(--font); font-size: 14px; color: var(--ink); outline: none; background: var(--card); }
  .drawer-search:focus { border-color: var(--ink-3); }
  .drawer-sub.hot { color: var(--d2, #3B7356); }
  .search-hint { margin: 8px 2px 0; font-size: 11px; color: var(--ink-3); letter-spacing: .02em; line-height: 1.6; }
</style>
</head>
<body>
<div class="page">

  <header class="masthead">
    <div class="wordmark">点定旅途</div>
    <button class="city" id="cityBtn"></button>
  </header>

  <div class="hero">
    <h1 class="display">今天，<br>从这里<em>出发。</em></h1>
    <p class="sub">酒店、小区、某个景区门口——任何地点都行。路线、时间和通勤，交给我。</p>
  </div>

  <div class="search-wrap">
    <div class="search">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="text" id="originInput" placeholder="酒店 / 小区 / 任意地点" autocomplete="off">
      <button class="locate" id="locateBtn">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
        定位
      </button>
    </div>
    <div class="suggest" id="suggest" hidden></div>
    <p class="search-hint" id="searchHint">全国任意地点都能搜，选中后自动匹配城市</p>
  </div>

  <section class="days">
    <p class="label">玩几天 · DAYS</p>
    <div class="days-row" id="daysRow">
      <button data-n="1">1<small>天</small></button>
      <button data-n="2">2<small>天</small></button>
      <button data-n="3" class="on">3<small>天</small></button>
      <button data-n="4">4<small>天</small></button>
      <button data-n="5">5<small>天</small></button>
    </div>
  </section>

  <div class="note">
    <p>起点是景区也可以——它会自动成为第 1 站，接着往下排。默认按明早出发排，生成后可一键切成「现在就走」。</p>
  </div>

  <p class="foot" id="foot"><span id="footCount">已覆盖 60+ 热门旅游城市</span> · <a href="privacy.html" style="color:inherit;text-decoration:underline;text-underline-offset:2px">隐私政策</a></p>

  <div class="dock">
    <button class="btn-primary" id="genBtn" disabled>
      生成我的路线
      <svg class="ic" viewBox="0 0 24 24" style="stroke:#fff;width:15px;height:15px"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>

</div>
<script src="/assets/engine.bundle.js"></script>
<script src="/assets/app.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const input = $('originInput'), suggest = $('suggest'), genBtn = $('genBtn');
  const searchHint = $('searchHint');

  let city = null;           // 不再预设默认城市：由搜索/定位自动判定，或手动选择
  let cityEntry = null;      // cities.json 中当前城市条目
  let spots = null;          // 当前城市 spots 库
  let days = 3;
  let selectedSpot = null;   // 搜索建议选中的景点
  let located = null;        // 定位结果 { name, lng, lat }
  let suggested = null;      // 云端搜索建议选中的 POI { name, lng, lat }

  // ---------- 天数 ----------
  $('daysRow').addEventListener('click', e => {
    const btn = e.target.closest('button[data-n]');
    if (!btn) return;
    days = +btn.dataset.n;
    [...$('daysRow').children].forEach(b => b.classList.toggle('on', b === btn));
  });

  // ---------- 城市切换 ----------
  $('cityBtn').appendChild(DDN.icon('pin', 'ic'));
  const cityName = DDN.el('span'); cityName.textContent = '选择城市';
  $('cityBtn').appendChild(cityName);

  // 城市名归一 + 是否已开通（腾讯/高德返回「上海市」，cities.json 里是「上海」）
  const normCity = s => String(s || '').replace(/市$/, '').replace(/(自治州|地区|盟)$/, '');
  const coveredCity = raw => {
    const n = normCity(raw);
    if (!n || !window.__cities) return null;
    return window.__cities.cities.find(c => c.status === 'done' &&
      (c.name === n || n.startsWith(c.name) || c.name.startsWith(n))) || null;
  };
  // 切换城市（唯一入口：手动选择、搜索结果、定位都走这里）
  async function setCity(name, tip) {
    const c = window.__cities && window.__cities.cities.find(x => x.name === name);
    if (!c || c.status !== 'done') return false;
    city = name; cityEntry = c; cityName.textContent = name;
    spots = await DDN.loadSpots(city).catch(() => null);
    refreshCta();
    if (!spots) DDN.toast('城市数据加载失败，请刷新重试');
    else if (tip) DDN.toast(tip);
    return !!spots;
  }
  // 最近去过的城市（localStorage，最多 5 个）
  function recentCities() {
    try { return JSON.parse(localStorage.getItem('ddn_recent_cities') || '[]'); } catch (e) { return []; }
  }
  function pushRecent(name) {
    try {
      const arr = recentCities().filter(x => x !== name);
      arr.unshift(name);
      localStorage.setItem('ddn_recent_cities', JSON.stringify(arr.slice(0, 5)));
    } catch (e) {}
  }
  $('cityBtn').onclick = () => {
    DDN.openDrawer('切换城市', (body, close) => {
      const regions = window.__cities.regions || {};
      const search = DDN.el('input', 'drawer-search');
      search.placeholder = '搜城市，如 武汉 / 敦煌';
      search.autocomplete = 'off';
      body.appendChild(search);
      const listBox = DDN.el('div');
      body.appendChild(listBox);
      const addCityItem = (host, name) => {
        const c = window.__cities.cities.find(x => x.name === name);
        const item = DDN.el('button', 'drawer-item' + (c && c.status === 'done' ? '' : ' dim'));
        item.appendChild(DDN.el('span', 'n', name));
        item.appendChild(DDN.el('span', 'g', c && c.status === 'done' ? '已开通' : '即将开通'));
        item.onclick = async () => {
          if (c && c.status === 'done') {
            input.value = ''; selectedSpot = null; located = null; suggested = null;
            close();
            await setCity(name);
            pushRecent(name);
            refreshCta();
          } else {
            close();
            DDN.toast(city ? ('「' + name + '」即将开通，先陪你玩' + city) : ('「' + name + '」即将开通'));
          }
        };
        host.appendChild(item);
      };
      const draw = q => {
        listBox.textContent = '';
        const kw = String(q || '').trim();
        const recent = recentCities().filter(n => !kw || n.includes(kw));
        if (!kw && recent.length) {
          listBox.appendChild(DDN.el('div', 'drawer-sub hot', '最近去过'));
          for (const name of recent) addCityItem(listBox, name);
        }
        for (const region of Object.keys(regions)) {
          const names = regions[region].filter(n => !kw || n.includes(kw));
          if (!names.length) continue;
          listBox.appendChild(DDN.el('div', 'drawer-sub', region));
          for (const name of names) addCityItem(listBox, name);
        }
        if (!listBox.children.length) listBox.appendChild(DDN.el("div", "drawer-sub", "没找到这座城市"));
      };
      search.addEventListener('input', () => draw(search.value));
      draw('');
      setTimeout(() => search.focus(), 60);
    });
  };

  // ---------- 搜索建议（本地库子串匹配 + 云端关键词提示，textContent 渲染） ----------
  function hideSuggest() { suggest.hidden = true; suggest.textContent = ''; }
  function poiType(t) {
    const x = String(t || '');
    if (/地铁|公交|车站/.test(x)) return '交通';
    if (/购物|商场|超市|便利店|商城/.test(x)) return '购物';
    if (/酒店|宾馆|民宿|客栈/.test(x)) return '住宿';
    if (/餐厅|小吃|美食|咖啡|茶/.test(x)) return '餐饮';
    return '';
  }
  function addSuggestItem(s, label, onPick) {
    const b = DDN.el('button');
    b.appendChild(DDN.el('span', null, s.name || s.title));
    const tp = poiType(s.name || s.title);
    if (tp) b.appendChild(DDN.el('span', 'tp', tp));
    b.appendChild(DDN.el('small' + (/外地/.test(label) ? ' away' : ''), null, label));
    b.onmousedown = e => {   // 先于 input blur 触发
      e.preventDefault();
      onPick();
      hideSuggest();
    };
    suggest.appendChild(b);
  }
  let cloudTimer = null;
  function showSuggest(local, keyword) {
    suggest.textContent = '';
    suggest.hidden = false;
    const sl = DDN.el('div', 'sl');
    sl.appendChild(DDN.el('i'));
    sl.appendChild(document.createTextNode('正在搜索…'));
    suggest.appendChild(sl);
    clearTimeout(cloudTimer);
    if (!DDN.cloudAvailable() || !keyword) return;
    cloudTimer = setTimeout(async () => {
      try {
        const j = await DDN.cloudPost('searchPoi', { keyword: keyword, region: city || '' }, 5000);
        const NOISE = /\[地铁站\]|\[公交站\]|\[停车场\]|地铁站|公交站|停车场|购物中心|商场|超市|便利店|银行|收费站/;
        let list = (j.data || []).filter(d => !NOISE.test(d.title));
        list = list.map(d => Object.assign({ __same: !!(city && normCity(d.city) === city) }, d))
          .sort((x, y) => (y.__same ? 1 : 0) - (x.__same ? 1 : 0)).slice(0, 8);
        if (input.value.trim() !== keyword) return;
        suggest.textContent = '';
        if (!list.length) {
          suggest.appendChild(DDN.el('div', 'sl', '没搜到，换个说法试试'));
          return;
        }
        for (const d of list) {
          const cov = coveredCity(d.city);
          const base = [normCity(d.city), d.district].filter(Boolean).join(' · ') || d.address || '地点';
          const label = cov ? base : ((normCity(d.city) || base) + ' · 未开通');
          addSuggestItem(d, label, async () => {
            input.value = d.title;   // 不完整输入 → 完整官方名称
            selectedSpot = null; located = null;
            suggested = { name: d.title, lng: d.lng, lat: d.lat };
            hideSuggest();
            if (!cov) {
              DDN.toast('「' + (normCity(d.city) || '该城市') + '」还没开通，换一座已开通城市试试');
              suggested = null;
              return;
            }
            if (cov.name !== city) await setCity(cov.name, '已按起点匹配到' + cov.name);
            if (searchHint) searchHint.textContent = '起点：' + d.title;
            refreshCta();
          });
        }
      } catch (e) {
        if (input.value.trim() !== keyword) return;
        suggest.textContent = '';
        suggest.appendChild(DDN.el('div', 'sl', '网络不稳，再试一次'));
      }
    }, 300);
  }
  // 回车：有建议时自动选第一条（保证「不完整输入 → 完整名称」）
  function pickFirstSuggest() {
    const first = suggest.querySelector('button');
    if (!first) return false;
    first.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true }));
    hideSuggest();
    return true;
  }
  input.addEventListener('input', () => {
    if (selectedSpot && input.value.trim() !== selectedSpot.name) selectedSpot = null;
    if (suggested && input.value.trim() !== suggested.name) suggested = null;
    if (located && input.value.trim() !== located.display) located = null;
    refreshCta();
    const q = input.value.trim();
    if (!q) { hideSuggest(); return; }
    showSuggest([], q);   // 起点搜索走云端模糊搜索（全国），不依赖景点库/城市选择
  });
  input.addEventListener('blur', () => setTimeout(hideSuggest, 120));
  input.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    pickFirstSuggest();
    input.blur();
  });

  // ---------- 定位：成功用坐标，失败/拒绝静默聚焦搜索框 ----------
  $('locateBtn').onclick = () => {
    if (!navigator.geolocation) { input.focus(); return; }
    navigator.geolocation.getCurrentPosition(
      pos => {
        const lng = +pos.coords.longitude.toFixed(6);
        const lat = +pos.coords.latitude.toFixed(6);
        located = { name: '当前位置', display: '当前位置', lng, lat };
        selectedSpot = null; suggested = null;
        input.value = '当前位置';
        hideSuggest();
        if (searchHint) searchHint.textContent = '定位中…';
        // 逆地址：拿城市 + 完整地址（完整地址作为起点名，路线里也显示完整名称）
        DDN.cloudPost('searchPoi', { lng: lng, lat: lat }, 6000).then(j => {
          const cov = coveredCity(j && j.city);
          const addr = (j && j.address) || '';
          if (addr) {
            const short = addr.length > 15 ? addr.slice(0, 15) + '…' : addr;
            input.value = short;
            located = { name: addr, display: short, lng: lng, lat: lat };
          }
          if (searchHint) searchHint.textContent = addr ? ('已定位：' + addr) : '已获取当前位置';
          if (cov && cov.name !== city) setCity(cov.name, '定位在' + cov.name + '，已切换');
          else if (!cov && j && j.city) DDN.toast('你当前位置在' + normCity(j.city) + '，还没开通');
          refreshCta();
        }).catch(() => {});
      },
      () => { input.focus(); },
      { timeout: 8000 }
    );
  };

  // CTA 可用性：有城市库、或已输入起点（裸文本可在加载页解析并自动定城）
  function refreshCta() {
    genBtn.disabled = !(spots || input.value.trim() || located);
  }

  // ---------- 生成路线：存请求快照 → 跳加载页（解析/校验/生成集中在加载页完成） ----------
  function resolveOrigin() {
    const text = input.value.trim();
    if (selectedSpot && text === selectedSpot.name) {
      return { name: selectedSpot.name, lng: selectedSpot.coord[0], lat: selectedSpot.coord[1], spotId: selectedSpot.id };
    }
    if (suggested && text === suggested.name) return suggested;
    if (located && text === located.display) return { name: located.name, lng: located.lng, lat: located.lat };
    if (text) return { name: text.slice(0, 30) };   // 裸文本：无坐标，由加载页 searchPoi 强匹配解析
    if (located) return located;
    if (!cityEntry) return null;                     // 未选城市且无起点：由调用方拦截
    return { name: city + '市中心', lng: cityEntry.center[0], lat: cityEntry.center[1] };
  }
  genBtn.onclick = () => {
    const origin = resolveOrigin();
    // 没选城市但写了起点：允许提交，由加载页解析起点并自动定城
    if (!origin) { DDN.toast('先写个起点，或选一座城市'); return; }
    if (!city && !spots && !input.value.trim()) { DDN.toast('先选个城市，再写个起点'); return; }
    try {
      DDN.saveRequest({
        city: city || null, days,
        origin,
        startDate: window.Engine.addDays(DDN.todayISO(), 1),  // 默认明早 09:00 出发
        startNow: false,
      });
      location.href = '/loading';
    } catch (e) {
      DDN.toast('出了点小问题，再试一次');
    }
  };

  // ---------- 初始化 ----------
  (async () => {
    // 从加载页错误态返回：还原上次输入；结果页数据缺失跳回时给出提示
    const backReq = DDN.loadRequest();
    const backErr = sessionStorage.getItem('ddn_err');
    try {
      const cities = await DDN.loadCities();
      window.__cities = cities;
      $('footCount').textContent = '已覆盖 ' + cities.cities.filter(c => c.status === 'done').length + ' 座热门旅游城市';
      // 从加载页返回时还原上次的城市与输入；首次进入保持「未选城市」
      if (backReq && backReq.city) await setCity(backReq.city);
      if (backReq && backReq.origin && backReq.origin.name
        && backReq.origin.name !== (backReq.city || '') + '市中心') {
        input.value = backReq.origin.name;
      }
    } catch (e) {
      DDN.toast('数据加载失败，请刷新重试');
    }
    if (backErr) { sessionStorage.removeItem('ddn_err'); DDN.toast(backErr); }
  })();
})();
</script>
</body>
</html>
