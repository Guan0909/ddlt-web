<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>点定旅途 · 路线</title>
<link rel="icon" type="image/svg+xml" href="/brand/logo-icon.svg">
<link rel="stylesheet" href="/assets/style.css">
<style>
  /* 顶栏 */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 22px 12px;
    background: rgba(251,251,248,.88);
    backdrop-filter: saturate(150%) blur(18px);
    -webkit-backdrop-filter: saturate(150%) blur(18px);
    border-bottom: .5px solid var(--hairline);
  }
  .back-btn { display: flex; align-items: center; color: var(--ink); }
  .topbar-title { flex: 1; min-width: 0; }
  .topbar-title b { font-family: var(--serif); font-size: 16.5px; display: block; letter-spacing: .02em; }
  .topbar-title span { font-size: 11px; color: var(--ink-2); letter-spacing: .04em; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 全幅地图（P3 离线 SVG 自绘，无在线底图） */
  .map-hero { position: relative; }
  .map-hero svg { display: block; width: 100%; height: 280px; }
  .map-fade {
    position: absolute; left: 0; right: 0; bottom: 0; height: 64px;
    background: linear-gradient(to top, var(--paper), rgba(251,251,248,0));
    pointer-events: none;
  }
  /* 放大/收起全屏 */
  .map-expand {
    position: absolute; left: 12px; top: 12px; z-index: 2;   /* #glMap 已压在 z-index:1 的层叠上下文里 */
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(251,251,248,.94); border: .5px solid var(--hairline);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(24,33,25,.08);
  }
  .map-expand .ic { width: 15px; height: 15px; color: var(--ink); }
  .map-hero.fullscreen {
    position: fixed; inset: 0; z-index: 70; background: var(--paper);
  }
  .map-hero.fullscreen #glMap, .map-hero.fullscreen svg#mapSvg { height: 100% !important; }   /* 覆盖 #glMap 内联 height:280px */
  .map-hero.fullscreen .map-fade { display: none; }
  .map-hero.fullscreen .map-expand { top: max(12px, env(safe-area-inset-top)); }
  body.map-lock { overflow: hidden; }
  /* 编辑模式：完成按钮浮在地图底部 */
  .edit-done {
    position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    z-index: 8; padding: 12px 44px; border-radius: 999px;
    background: var(--d1); color: #fff; font-size: 15px; font-weight: 600; letter-spacing: .1em;
    box-shadow: 0 6px 20px rgba(59,115,86,.35);
  }
  .map-hero.fullscreen.editing .map-expand { display: none; }
  /* 动态地图控制 */
  #glMap { position: relative; z-index: 1; }   /* 自建层叠上下文，把 GL 内部高层级元素关在里面 */
  #mapSvg { touch-action: none; cursor: grab; }
  #mapSvg.grabbing { cursor: grabbing; }
  .map-zoom {
    position: absolute; right: 12px; top: 12px; z-index: 5;
    display: flex; flex-direction: column; gap: 6px;
  }
  .map-zoom button {
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(251,251,248,.94); border: .5px solid var(--hairline);
    font-size: 17px; color: var(--ink); line-height: 1;
    box-shadow: 0 2px 8px rgba(24,33,25,.08);
  }
  .map-hint {
    margin: 8px 22px 0; font-size: 11px; letter-spacing: .04em; color: var(--ink-3);
    text-align: center; pointer-events: none;
  }
  .spot-hit { cursor: pointer; }
  .drawer-photo { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-top: 8px; }

  /* 导航选择：两个入口同款按钮 */
  .nav-actions { display: flex; gap: 10px; margin-top: 12px; }
  .nav-btn {
    flex: 1; min-height: 46px; border-radius: 999px;
    border: .5px solid var(--ink); background: var(--card); color: var(--ink);
    font-size: 14px; font-weight: 600; letter-spacing: .02em;
  }

  /* --- 浏览态/编辑态分离 · 卡片详情 · 编辑天上下文（2026-10-18） --- */
  .stop-thumb.ph {
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--ink-3); background: var(--hairline);
  }
  .card-toggle {
    margin-top: 6px; font-size: 11.5px; color: var(--ink-3); letter-spacing: .04em;
    display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 2px;
  }
  .card-toggle .ic { width: 12px; height: 12px; }
  .card-edit { display: none; }
  .t-body.expanded .card-edit { display: block; }
  .dur-row span, .edit-bar button { min-height: 40px; display: inline-flex; align-items: center; justify-content: center; }
  .edit-day-bar {
    position: absolute; left: 0; right: 0; top: 58px; z-index: 25;
    display: flex; align-items: center; gap: 6px; padding: 8px 12px;
    background: linear-gradient(rgba(250,251,248,.97), rgba(250,251,248,.82));
    pointer-events: auto;
  }
  .edit-day-bar .chip {
    font-size: 12px; min-height: 30px; padding: 0 11px; border-radius: 999px;
    border: .5px solid var(--hairline); background: var(--card); color: var(--ink-2);
  }
  .edit-day-bar .chip.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .edit-day-bar .sum { margin-left: auto; font-size: 11px; color: var(--ink-3); }
  .edit-day-bar[hidden] { display: none; }
  .sheet-photos { display: flex; gap: 6px; overflow-x: auto; margin: 6px 0 2px; scroll-snap-type: x mandatory; }
  .sheet-photos img { width: 84%; height: 130px; object-fit: cover; border-radius: 8px; flex: none; scroll-snap-align: start; background: var(--hairline); }
  .sheet-addr { font-size: 12px; color: var(--ink-2); margin-top: 6px; display: flex; gap: 6px; align-items: flex-start; line-height: 1.5; }
  .sheet-addr .ic { width: 13px; height: 13px; margin-top: 2px; flex: none; }
  .sheet-intro { font-size: 13px; line-height: 1.7; color: var(--ink-2); margin-top: 8px; }
  .sheet-acts { display: flex; gap: 8px; margin-top: 12px; }
  .sheet-acts button { flex: 1; min-height: 44px; }
  .commute-note { margin: 8px 22px 0; font-size: 11.5px; color: var(--ink-3); text-align: center; letter-spacing: .02em; }
  .commute-note[hidden] { display: none; }
  .day-tabs { position: sticky; top: 0; z-index: 6; background: var(--paper); }

  /* 编辑旅途：两级搜索（精选库 / 地图地点） */
  .edit-search {
    position: absolute; left: 12px; right: 12px; top: 12px; z-index: 30;
    display: flex; align-items: center; gap: 9px;
    background: rgba(251,251,248,.98); border: .5px solid var(--hairline);
    border-radius: 12px; padding: 9px 12px;
    box-shadow: 0 6px 20px rgba(24,33,25,.10);
  }
  .edit-search .ic { width: 15px; height: 15px; color: var(--ink-3); flex: none; }
  .edit-search input {
    flex: 1; min-width: 0; border: none; outline: none; background: transparent;
    font-size: 14.5px; font-family: var(--font); color: var(--ink);
  }
  .edit-search input::placeholder { color: var(--ink-3); }
  .edit-search button { font-size: 12.5px; color: var(--ink-2); flex: none; }
  /* 注意：.edit-search 自己设了 display:flex，会盖掉 hidden 属性的 UA 样式——必须显式补 [hidden] */
  .edit-search[hidden], .edit-results[hidden] { display: none; }
  .edit-results {
    position: absolute; left: 12px; right: 12px; top: 62px; z-index: 30;
    max-height: 44vh; overflow-y: auto;
    background: rgba(251,251,248,.99); border: .5px solid var(--hairline);
    border-radius: 12px; box-shadow: 0 10px 28px rgba(24,33,25,.14);
  }
  .es-group { padding: 10px 14px 4px; font-size: 10px; letter-spacing: .18em; color: var(--ink-3); }
  .es-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 10px 14px; border-bottom: .5px solid var(--hairline); text-align: left;
  }
  .es-item:last-child { border-bottom: none; }
  .es-item .n { font-size: 14px; font-weight: 600; color: var(--ink); }
  .es-item .g { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
  .es-item .st { flex: none; font-size: 11.5px; color: var(--ink-2); }
  .es-item.on .st { color: var(--d1); font-weight: 600; }
  .es-empty { padding: 14px; font-size: 12px; color: var(--ink-3); line-height: 1.6; }
  .stop-flag-custom {
    font-size: 9.5px; letter-spacing: .1em; color: var(--ink-3);
    border: .5px solid var(--hairline); border-radius: 999px; padding: 2px 6px;
  }

  /* 日切换：文字页签 */
  .day-tabs { display: flex; gap: 26px; padding: 4px 22px 0; overflow-x: auto; }
  .day-tabs button {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    padding: 8px 0 10px; position: relative; color: var(--ink-3); flex: none;
  }
  .day-tabs button b { font-family: var(--serif); font-size: 17px; font-weight: 700; }
  .day-tabs button small { font-size: 10.5px; letter-spacing: .1em; }
  .day-tabs button.on { color: var(--ink); }
  .day-tabs button.on::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0;
    height: 2px; background: var(--c); border-radius: 2px;
  }

  .anchor-note {
    display: flex; align-items: center; gap: 7px;
    padding: 14px 22px 0; font-size: 12.5px; color: var(--ink-2);
  }
  .anchor-note .ic { width: 13px; height: 13px; }
  .anchor-note b { color: var(--ink); font-weight: 600; }
  .anchor-note a { color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .anchor-note { cursor: pointer; }
  .anchor-note.busy { opacity: .7; pointer-events: none; }
  .anchor-note .anchor-tip { color: var(--ink-3); font-size: 10.5px; }
  .dur-row .dur-label { color: var(--ink-3); cursor: default; font-size: 10.5px; letter-spacing: .04em; align-self: center; }
  .drawer-item.on .g { color: var(--d2); font-weight: 600; }

  /* AI 叙事行：衬线斜体，模板先行，AI 返回后替换并亮标 */
  .narrative {
    margin: 8px 22px 0; font-family: var(--serif); font-style: italic;
    font-size: 13px; color: var(--ink-2); line-height: 1.7;
  }
  .narrative:empty { display: none; }
  .narrative .ai-tag {
    font-family: var(--font); font-style: normal; font-size: 9.5px; letter-spacing: .12em;
    color: var(--ink-3); border: .5px solid var(--hairline); border-radius: 999px;
    padding: 2px 6px; margin-left: 6px; vertical-align: 1px;
  }

  /* 攻略提取（换一站抽屉内） */
  .paste-box {
    width: 100%; min-height: 68px; resize: none;
    border: .5px solid var(--hairline); border-radius: 8px;
    background: var(--card); padding: 10px 12px;
    font-family: var(--font); font-size: 13px; color: var(--ink);
    outline: none; margin-bottom: 8px;
  }
  .paste-box:focus { border-color: var(--ink-3); }
  .paste-btn {
    width: 100%; padding: 10px; margin-bottom: 10px;
    border: .5px solid var(--ink); border-radius: 999px;
    font-size: 12.5px; font-weight: 600; letter-spacing: .06em; color: var(--ink);
  }
  .paste-btn:disabled { opacity: .4; }

  /* 景点缩略图：卡片右上圆角小图，不占文字流 */
  .t-body { position: relative; }
  .stop-thumb {
    position: absolute; right: 0; top: 10px;
    width: 46px; height: 46px; object-fit: cover;
    border-radius: 8px; background: var(--hairline);
  }
  .t-body:has(.stop-thumb) .stop-name,
  .t-body:has(.stop-thumb) .stop-tags,
  .t-body:has(.stop-thumb) .stop-reason { padding-right: 54px; }

  /* 统计：衬线大数字 + 发丝线 */
  .stats {
    display: flex; margin: 16px 22px 0; padding: 16px 0;
    border-top: .5px solid var(--hairline); border-bottom: .5px solid var(--hairline);
  }
  .stats div { flex: 1; text-align: center; }
  .stats div + div { border-left: .5px solid var(--hairline); }
  .stats b { font-family: var(--serif); font-size: 21px; font-weight: 700; display: block; font-variant-numeric: tabular-nums; }
  .stats b i { font-style: normal; font-size: 12px; color: var(--ink-2); margin-left: 1px; }
  .stats span { font-size: 10px; letter-spacing: .14em; color: var(--ink-3); }

  /* 时间轴 */
  .timeline { margin: 10px 22px 0; position: relative; }
  .timeline::before {
    content: ""; position: absolute; left: 63.5px; top: 14px; bottom: 14px;
    width: 1px; background: var(--hairline);
  }
  .t-item { display: flex; gap: 13px; position: relative; padding-bottom: 6px; }
  .t-time { width: 40px; flex: none; text-align: right; padding-top: 15px; font-variant-numeric: tabular-nums; }
  .t-time b { font-size: 13px; font-weight: 600; display: block; }
  .t-time span { font-size: 9.5px; color: var(--ink-3); }
  .t-node { width: 22px; flex: none; display: flex; justify-content: center; padding-top: 17px; z-index: 1; }
  .t-node i {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--paper); border: 2.5px solid var(--d1);
    box-shadow: 0 0 0 3px var(--paper);
  }
  .t-node i.ink { background: var(--ink); border-color: var(--ink); }
  .t-node i.tiny { width: 5px; height: 5px; border-width: 0; background: var(--ink-3); margin-top: 6px; }
  .t-body { flex: 1; min-width: 0; padding: 10px 0 12px; border-bottom: .5px solid var(--hairline); }
  .t-item:last-child .t-body { border-bottom: none; }

  .stop-name { font-size: 16px; font-weight: 650; letter-spacing: .01em; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .stop-name .flag { font-size: 10px; font-weight: 600; letter-spacing: .12em; color: var(--d1); }
  .stop-name .flag.mint { color: var(--d2); }
  /* 高德景区等级徽章（5A/4A/3A）：权威「值得去」信号 */
  .stop-alevel {
    font-family: var(--font); font-size: 9.5px; font-weight: 600; letter-spacing: .1em;
    color: var(--d2); border: .5px solid var(--d2); border-radius: 999px;
    padding: 1px 5px; vertical-align: 1px;
  }
  .stop-tags { margin-top: 4px; font-size: 11.5px; color: var(--ink-3); letter-spacing: .05em; }
  /* 事实行：评分 · 营业时间 · 电话（高德 POI 回填，缺项省略） */
  .stop-facts { margin-top: 3px; font-size: 10.5px; color: var(--ink-3); letter-spacing: .02em; }
  .stop-reason {
    margin-top: 7px; font-family: var(--serif); font-style: italic;
    font-size: 13px; color: var(--ink-2); line-height: 1.6;
  }
  .stop-clock {
    margin-top: 8px; font-size: 11.5px; color: var(--ink-2);
    display: flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums;
  }
  .stop-clock .ic { width: 12px; height: 12px; }

  .notice {
    margin-top: 8px; padding: 7px 0 7px 10px;
    border-left: 2px solid var(--ink);
    font-size: 11.5px; color: var(--ink-2); line-height: 1.5;
  }

  /* 通勤行 */
  .commute { display: flex; align-items: center; gap: 8px; padding: 12px 0; }
  .commute .ic { width: 15px; height: 15px; color: var(--ink-3); }
  .commute .txt { flex: 1; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .commute .txt b { color: var(--ink); font-weight: 600; }
  .commute .go { display: flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

  /* 起点/终点行 */
  .endpoint b { font-size: 14px; font-weight: 650; }
  .endpoint span { display: block; font-size: 11px; color: var(--ink-3); margin-top: 2px; }

  /* 微调区 */
  .dur-row { display: flex; gap: 14px; margin-top: 9px; font-size: 11.5px; color: var(--ink-3); }
  .dur-row span { cursor: pointer; }
  .dur-row span.on { color: var(--ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .edit-bar {
    margin-top: 10px; padding-top: 9px; border-top: .5px dashed var(--hairline);
    display: flex; gap: 16px; font-size: 11.5px; color: var(--ink-2); flex-wrap: wrap;
  }
  .edit-bar button { color: var(--ink-2); letter-spacing: .04em; }
  .edit-bar button.danger { color: #B3402A; }
  .edit-bar button:disabled { opacity: .32; pointer-events: none; }
  /* 「信息有误」反馈入口：贴右，与编辑动作拉开距离（privacy.html 承诺每卡都有） */
  .edit-bar button.report { margin-left: auto; color: var(--ink-3); }
  .edit-bar button.report:active { color: var(--ink); }

  /* 被挤掉的站（原型无此元素，低调呈现） */
  .dropped-note { margin: 6px 22px 0; font-size: 11.5px; color: var(--ink-2); line-height: 1.7; }

  .page { padding-bottom: 118px; }
  .dock-row { display: flex; align-items: center; gap: 8px; }
  .dock-row .btn-primary { flex: 1; }
  .anchor-note .anchor-time { text-decoration: underline; text-underline-offset: 3px; }
  .anchor-note .anchor-time:hover { color: var(--d2); }
  .pick-grid { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 4px; }
  .pick-chip { min-height: 38px; padding: 0 14px; border-radius: 999px; border: .5px solid var(--hairline); background: var(--card); font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .pick-chip.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .pick-note { margin-top: 8px; }
  .anchor-days { color: var(--ink-3); font-size: 10.5px; margin-left: 6px; }
  .day-stepper { display: flex; align-items: center; gap: 10px; margin: 6px 0 2px; }
  .step-btn { min-height: 42px; padding: 0 16px; border-radius: 999px; border: .5px solid var(--hairline); background: var(--card); font-size: 13.5px; color: var(--ink); }
  .step-btn:disabled { opacity: .38; }
  .step-num { font-family: var(--serif); font-size: 19px; min-width: 58px; text-align: center; }
</style>
</head>
<body>
<div class="page">

  <header class="topbar">
    <button class="back-btn" id="backBtn">
      <svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="topbar-title">
      <b id="ttTitle"></b>
      <span id="ttSub"></span>
    </div>
  </header>

  <div class="map-hero" id="mapHero">
    <svg id="mapSvg" viewBox="0 0 400 280" role="img" aria-label="当日路线地图"></svg>
    <div id="glMap" style="display:none;width:100%;height:280px"></div>
    <button class="map-expand" id="mapExpand" aria-label="放大地图">
      <svg class="ic ic-open" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
      <svg class="ic ic-close" viewBox="0 0 24 24" hidden><path d="M5 8h5V3M19 8h-5V3M5 16h5v5M19 16h-5v5"/></svg>
    </button>
    <button class="edit-done" id="editDone" hidden>完成</button>
    <div class="map-zoom"><button id="zoomIn">+</button><button id="zoomOut">−</button></div>
    <div class="edit-search" id="editSearch" hidden>
      <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="editSearchInput" placeholder="搜景点，或任意地点加入今天" autocomplete="off">
      <button id="editSearchClose">关闭</button>
    </div>
    <div class="edit-results" id="editResults" hidden></div>
    <div class="map-fade"></div>
    <div class="edit-day-bar" id="editDayBar" hidden></div>
  </div>

  <div class="map-hint">拖动平移 · 点淡色圆点可把景点加入今天</div>

  <div class="day-tabs" id="dayTabs"></div>

  <div class="anchor-note" id="anchorNote"></div>

  <p class="narrative" id="narrative"></p>

  <div class="stats" id="statsBar"></div>
  <div class="commute-note" id="statsNote" hidden></div>

  <div class="timeline" id="timeline"></div>
  <div class="dropped-note" id="droppedNote" hidden></div>

  <div class="dock">
    <div class="dock-row">
      <button class="btn-text" id="editBtn">
        <svg class="ic" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        编辑旅途
      </button>
      <button class="btn-primary" id="shareBtn">
        <svg class="ic" viewBox="0 0 24 24" style="stroke:#fff;width:15px;height:15px"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg>
        分享 / 海报
      </button>
    </div>
  </div>

</div>
<script src="/assets/engine.bundle.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/glmap.js"></script>
<script>
(() => {
  const route = DDN.loadRoute();
  if (!route || !route.dayPlans || !route.dayPlans.length) {
    try { sessionStorage.setItem('ddn_err', '路线数据不在了，重新生成一次吧'); } catch (e) {}
    location.replace('/');
    return;
  }
  const $ = id => document.getElementById(id);
  let spots = [];
  let cur = 0;

  const spotById = id => spots.find(s => s.id === id) || null;

  // ---------- 顶栏 ----------
  $('backBtn').onclick = () => { location.href = '/index.html'; };
  $('ttTitle').textContent = `${route.city || ''} · ${DDN.dayCn(route.days)}日`;
  // 地图/海报不画返程段（§9.5），文案不承诺「环线」，只说时刻表里真实存在的「晚上回到这里」
  $('ttSub').textContent = `${DDN.dateRange(route.startDate, route.days)} · 从${route.origin.name}出发，晚上回到这里`;
  document.title = `点定旅途 · ${route.city || ''}${DDN.dayCn(route.days)}日`;

  // ---------- 出发时间：可点选修改；按可用时间自动决定一天排几站 ----------
  const START_OPTIONS = [
    { m: 7 * 60 + 30, label: '早起', desc: '全天 · 可多排一两处' },
    { m: 9 * 60, label: '标准', desc: '全天' },
    { m: 10 * 60 + 30, label: '稍晚', desc: '大半天' },
    { m: 12 * 60, label: '午间', desc: '大半天 · 比全天少一处' },
    { m: 14 * 60, label: '午后', desc: '半天 · 少一两处' },
    { m: 16 * 60, label: '傍晚前', desc: '半天 · 只排近处' },
  ];
  function startMinNow() {
    const hm = (route.dayPlans[0] && route.dayPlans[0].startTime) || '09:00';
    const parts = String(hm).split(':');
    const h = +parts[0], m = +parts[1];
    return (isFinite(h) ? h : 9) * 60 + (isFinite(m) ? m : 0);
  }
  function dayLoadLabel(mins) {
    if (mins >= 12 * 60) return '半天';
    if (mins >= 10 * 60 + 30) return '大半天';
    return '全天';
  }
  function startMinOf(i) {
    const arr = route.__startMin;
    if (Array.isArray(arr) && Number.isFinite(arr[i])) return arr[i];
    const dp = route.dayPlans[i] || {};
    const hm = dp.startTime || '09:00';
    const parts = String(hm).split(':');
    const h = +parts[0], m = +parts[1];
    return (isFinite(h) ? h : 9) * 60 + (isFinite(m) ? m : 0);
  }
  function dayLoadLabel(mins) {
    if (mins >= 12 * 60) return '半天';
    if (mins >= 10 * 60 + 30) return '大半天';
    return '全天';
  }
  function renderAnchor() {
    const box = $('anchorNote');
    box.textContent = '';
    const curMin = startMinOf(cur);
    box.appendChild(DDN.icon('clock', 'ic'));
    box.appendChild(document.createTextNode('按 '));
    const t = DDN.el('b', 'anchor-time', window.Engine.fmt(curMin));
    t.title = cur === 0 ? '点击修改出发时间或天数' : '点击修改这一天的出发时间';
    box.appendChild(t);
    box.appendChild(document.createTextNode(' 出发 · ' + dayLoadLabel(curMin)));
    if (cur === 0) box.appendChild(DDN.el('span', 'anchor-days', '共 ' + route.days + ' 天'));
    if (curMin >= 12 * 60) box.appendChild(DDN.el('span', 'anchor-tip', '  想多玩几处可改早一点'));
    box.onclick = () => openStartPicker();
  }
  function openStartPicker() {
    const dayStart = startMinOf(cur);
    const curDays = route.days || route.dayPlans.length || 3;
    DDN.openDrawer(cur === 0 ? '出发时间 · 天数' : 'D' + (cur + 1) + ' 出发时间', (body, close) => {
      body.appendChild(DDN.el('div', 'drawer-sub', '出发时间'));
      const timeWrap = DDN.el('div', 'pick-grid');
      for (const o of START_OPTIONS) {
        const chip = DDN.el('button', 'pick-chip' + (o.m === dayStart ? ' on' : ''), window.Engine.fmt(o.m));
        chip.onclick = () => {
          close();
          if (o.m === dayStart) return;
          if (cur === 0) reschedule(o.m, curDays);
          else changeDayStart(cur, o.m);
        };
        timeWrap.appendChild(chip);
      }
      body.appendChild(timeWrap);
      if (cur === 0) {
        body.appendChild(DDN.el('div', 'drawer-sub', '天数'));
        const stepper = DDN.el('div', 'day-stepper');
        const minus = DDN.el('button', 'step-btn', '− 减少一天');
        minus.disabled = curDays <= 1;
        minus.onclick = () => { close(); if (curDays > 1) reschedule(dayStart, curDays - 1); };
        const num = DDN.el('b', 'step-num', curDays + ' 天');
        const plus = DDN.el('button', 'step-btn', '+ 增加一天');
        plus.disabled = curDays >= 5;
        plus.onclick = () => { close(); if (curDays < 5) reschedule(dayStart, curDays + 1); };
        stepper.append(minus, num, plus);
        body.appendChild(stepper);
        body.appendChild(DDN.el('div', 'drawer-sub pick-note', '改时间或天数会重排整条路线。'));
      } else {
        body.appendChild(DDN.el('div', 'drawer-sub pick-note', '只调整第 ' + (cur + 1) + ' 天的出发时间，其余天不变。'));
      }
    });
  }
  async function changeDayStart(i, mins) {
    if (!Array.isArray(route.__startMin)) route.__startMin = route.dayPlans.map(dp => DDN.parseHM(dp.startTime));
    route.__startMin[i] = mins;
    const box = $('anchorNote');
    box.classList.add('busy');
    await applyRetime(i);
    DDN.saveRoute(route);
    box.classList.remove('busy');
    renderAnchor();
  }
  async function reschedule(startMin, days) {
    const box = $('anchorNote');
    box.classList.add('busy');
    box.textContent = '正在重新排…';
    let r = null;
    try {
      const j = await DDN.cloudGenRoute({
        city: route.city, origin: route.origin, days: days,
        startDate: route.startDate, startMin: startMin,
      });
      r = j.route;
      if (j.routeId) r.routeId = j.routeId;
    } catch (e) { /* fallback local */ }
    if (!r) {
      r = window.Engine.genRoute({
        spots, origin: route.origin, days: days,
        startDate: route.startDate, startMin: startMin, city: route.city,
      });
    }
    DDN.attachStops(r, spots);
    DDN.saveRoute(r);
    location.reload();
  }

  // ---------- 日切换 Tab ----------
  function renderTabs() {
    const box = $('dayTabs');
    box.textContent = '';
    route.dayPlans.forEach((dp, i) => {
      const b = DDN.el('button', i === cur ? 'on' : '');
      b.style.setProperty('--c', dp.color);
      b.appendChild(DDN.el('b', null, `D${dp.day}`));
      b.appendChild(DDN.el('small', null, DDN.themeOf(dp.label)));
      b.onclick = () => { cur = i; renderDay(); renderAnchor(); };
      box.appendChild(b);
    });
  }

  // ---------- 统计条 ----------
  function statCell(value, unit, label) {
    const d = DDN.el('div');
    const b = DDN.el('b');
    b.appendChild(document.createTextNode(value));
    if (unit) { const i = DDN.el('i', null, unit); b.appendChild(i); }
    d.appendChild(b);
    d.appendChild(DDN.el('span', null, label));
    return d;
  }
  function renderStats() {
    const box = $('statsBar');
    box.textContent = '';
    const t = route.totals;
    box.appendChild(statCell(String(t.km), 'km', '全程'));
    box.appendChild(statCell(String(t.stops), null, '站点'));
    box.appendChild(statCell(DDN.fmtHour(t.visitMin), 'h', '游览'));
    box.appendChild(statCell(DDN.fmtHour(t.commuteMin), 'h', '通勤'));
    // 通勤占比过高时给一句可执行的提示（独立节点，避免挤坏统计行）
    const note = $('statsNote');
    if (note) {
      const show = t.visitMin > 0 && t.commuteMin > t.visitMin * 0.4;
      note.hidden = !show;
      if (show) note.textContent = '通勤占比较多：可减少远郊点，或把交通方式换成驾车';
    }
  }

  // ---------- 动态交互地图：大图拖拽平移（免重拉）+ 按钮缩放（重拉）+ 点选景点加入当天 ----------
  const MW = 400, MH = 280, PAD = 36;          // 视口
  const BW = 800, BH = 560;                    // 底图实际取图尺寸（2 倍，平移有冗余）
  const mapState = { day: -1, zoom: 12, cLng: 0, cLat: 0, offX: 0, offY: 0, proj: null, baseURI: null };
  let mapReq = 0, mapBusy = false;
  let glCtl = null;   // 腾讯 GL 动态地图控制器（有 DDN_GL_KEY 时启用）
  let editMode = false;   // 编辑旅途模式：全屏显示全部景点，点选加减当天站点

  async function renderMap(keepView) {
    if (glCtl) {   // GL 动态地图路径
      const dp = route.dayPlans[cur];
      // 组装腿（起点→各站）与各腿通勤方式，供真实路网路径；不画返程
      // 引擎按环线规划，commute 里末尾的"回起点"腿这里不使用（modes 最后一个元素落空）
      const seq = [
        { lng: route.origin.lng, lat: route.origin.lat },
        ...(route.__stops[cur] || []).map(s => ({ lng: s.coord[0], lat: s.coord[1] })),
      ];
      const modes = dp.items.filter(i => i.type === 'commute').map(i => i.mode);
      const legs = [];
      for (let i = 0; i < seq.length - 1; i++) legs.push({ from: seq[i], to: seq[i + 1], mode: modes[i] || 'drive' });
      glCtl.setDay({
        origin: route.origin,
        stops: route.__stops[cur] || [],
        others: spots,
        color: dp.color,
        legs,
        mode: editMode ? 'edit' : 'plan',
        keepView: !!keepView,
      });
      return;
    }
    const reqId = ++mapReq;
    const dp = route.dayPlans[cur];
    const stopItems = dp.items.filter(i => i.type === 'stop');
    const pts = [
      { lng: route.origin.lng, lat: route.origin.lat, name: route.origin.name, origin: true },
      ...stopItems.map(s => ({ lng: s.coord.lng, lat: s.coord.lat, name: s.name, id: s.id })),
    ];

    // 换日才重拉底图并重置视野；同日微调只重绘覆盖层
    if (mapState.day !== cur) {
      const lngs = pts.map(p => p.lng), lats = pts.map(p => p.lat);
      mapState.cLng = (Math.min(...lngs) + Math.max(...lngs)) / 2;
      mapState.cLat = (Math.min(...lats) + Math.max(...lats)) / 2;
      mapState.zoom = DDN.fitZoom(pts, MW, MH, PAD);
      mapState.offX = 0; mapState.offY = 0;
      mapState.proj = null; mapState.baseURI = null;
      if (DDN.cloudAvailable()) {
        mapBusy = true;
        try {
          const b = await DDN.fetchBaseMap(pts, BW, BH, PAD * 2);
          if (reqId !== mapReq) return;
          mapState.proj = b.proj; mapState.baseURI = b.dataURI;
        } catch (e) { /* 回退示意 */ }
        mapBusy = false;
      }
      if (!mapState.proj) mapState.proj = DDN.makeProjector(pts, BW, BH, PAD * 2);
      mapState.day = cur;
    }
    drawMap(stopItems, pts);
  }

  function drawMap(stopItems, pts) {
    const svg = $('mapSvg');
    svg.textContent = '';
    const { proj, baseURI, offX, offY } = mapState;
    const fontFam = "-apple-system,'PingFang SC','Microsoft YaHei'";
    const tx = -(BW / 2 - MW / 2 + offX), ty = -(BH / 2 - MH / 2 + offY);

    const pan = DDN.svgEl('g', { id: 'panLayer', transform: `translate(${tx} ${ty})` });
    svg.appendChild(pan);

    if (baseURI) {
      pan.appendChild(DDN.svgEl('image', {
        href: baseURI, x: 0, y: 0, width: BW, height: BH, preserveAspectRatio: 'none',
        style: `filter:${DDN.MAP_SOFT_FILTER};opacity:.9`,
      }));
    } else {
      pan.appendChild(DDN.svgEl('rect', { x: 0, y: 0, width: BW, height: BH, fill: '#F3F5F0' }));
    }

    const P = pts.map(p => Object.assign({ pt: proj(p) }, p));
    const dp = route.dayPlans[cur];
    const inRoute = new Set(stopItems.map(s => s.id));

    // 全部景点：实心点 + 小字标注（可点选加入今天；与路线点/已放标签碰撞时只留点）
    const placed = P.map(p => ({ x: p.pt.x, y: p.pt.y, w: 34 }));
    for (const s of spots) {
      if (inRoute.has(s.id) || !s.coord) continue;
      const q = proj({ lng: s.coord[0], lat: s.coord[1] });
      const dot = DDN.svgEl('circle', {
        cx: q.x, cy: q.y, r: 3.4, fill: '#7d887f', opacity: .9,
        stroke: '#FBFBF8', 'stroke-width': 1.2,
        class: 'spot-hit', 'data-id': s.id,
      });
      pan.appendChild(dot);
      const wHalf = s.name.length * 8.5 / 2 + 6;
      const clash = placed.some(b => Math.abs(b.x - q.x) < (b.w + wHalf) && Math.abs(b.y - (q.y - 10)) < 13);
      if (clash) continue;
      const t = DDN.svgEl('text', {
        x: q.x, y: q.y - 8, 'font-size': 8.5, 'font-weight': 600,
        fill: '#4a554d', 'font-family': fontFam, 'text-anchor': 'middle', opacity: .95,
        class: 'spot-hit', 'data-id': s.id,
        style: 'paint-order:stroke;stroke:#FBFBF8;stroke-width:3',
      });
      t.textContent = s.name;
      pan.appendChild(t);
      placed.push({ x: q.x, y: q.y - 8, w: wHalf });
    }

    // 路线（中点二次贝塞尔平滑，开放路径不回起点）；真实路网路径到达后替换
    const d = DDN.smoothPathD(P.map(p => p.pt));
    let haloEl = null, mainEl = null;
    if (P.length > 1) {
      haloEl = DDN.svgEl('path', { d, fill: 'none', stroke: '#fff', 'stroke-width': 4.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: .85 });
      mainEl = DDN.svgEl('path', { d, fill: 'none', stroke: dp.color, 'stroke-width': 2.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
      pan.appendChild(haloEl);
      pan.appendChild(mainEl);
    }

    // 真实路网路径（routePaths 云函数，dist_cache 缓存；失败保持平滑示意线）
    if (P.length > 1 && DDN.cloudAvailable()) {
      const seq = [pts[0], ...stopItems.map(s => ({ lng: s.coord.lng, lat: s.coord.lat }))];
      const modes = dp.items.filter(i => i.type === 'commute').map(i => i.mode);
      const legs = [];
      for (let i = 0; i < seq.length - 1; i++) legs.push({ from: seq[i], to: seq[i + 1], mode: modes[i] || 'drive' });
      const myReq = mapReq;
      DDN.cloudPost('routePaths', { legs }, 12000).then(j => {
        if (myReq !== mapReq || !j.paths || !haloEl || !mainEl) return;
        let rd = '';
        j.paths.forEach((path, i) => {
          const raw = (path && path.length >= 2) ? path : [[legs[i].from.lat, legs[i].from.lng], [legs[i].to.lat, legs[i].to.lng]];
          raw.forEach((p, k) => {
            const q = mapState.proj({ lng: p[1], lat: p[0] });
            rd += `${k === 0 ? 'M' : 'L'}${q.x.toFixed(1)} ${q.y.toFixed(1)} `;
          });
        });
        haloEl.setAttribute('d', rd);
        mainEl.setAttribute('d', rd);
      }).catch(() => {});
    }

    // 起点 + 站点
    const o = P[0].pt;
    pan.appendChild(DDN.svgEl('circle', { cx: o.x, cy: o.y, r: 8.5, fill: '#182119', stroke: '#fff', 'stroke-width': 2.5 }));
    const ot = DDN.svgEl('text', { x: o.x, y: o.y + 3.2, 'font-size': 8.5, fill: '#fff', 'font-weight': 700, 'text-anchor': 'middle' });
    ot.textContent = '起';
    pan.appendChild(ot);
    P.slice(1).forEach(p => {
      pan.appendChild(DDN.svgEl('circle', { cx: p.pt.x, cy: p.pt.y, r: 5.5, fill: dp.color, stroke: '#fff', 'stroke-width': 1.8 }));
      const t = DDN.svgEl('text', {
        x: p.pt.x, y: p.pt.y - 11, 'font-size': 10, 'font-weight': 600,
        fill: '#182119', 'font-family': fontFam, 'text-anchor': 'middle',
        style: 'paint-order:stroke;stroke:#FBFBF8;stroke-width:3',
      });
      t.textContent = p.name;
      pan.appendChild(t);
    });
    const on = DDN.svgEl('text', {
      x: o.x, y: o.y + 22, 'font-size': 10, 'font-weight': 600,
      fill: '#182119', 'font-family': fontFam, 'text-anchor': 'middle',
      style: 'paint-order:stroke;stroke:#FBFBF8;stroke-width:3',
    });
    const oname = P[0].name || '';
    on.textContent = oname.length > 10 ? oname.slice(0, 9) + '…' : oname;
    pan.appendChild(on);

    if (baseURI) {
      const at = DDN.svgEl('text', {
        x: MW - 6, y: MH - 6, 'font-size': 7, fill: 'rgba(0,0,0,.45)',
        'font-family': fontFam, 'text-anchor': 'end',
        style: 'paint-order:stroke;stroke:rgba(255,255,255,.8);stroke-width:2',
      });
      at.textContent = '地图数据 © 腾讯位置服务';
      svg.appendChild(at);   // 固定在视口，不随平移
    }
  }

  // 拖拽/点选/缩放交互（只挂一次）
  let mapBound = false;
  function bindMap() {
    if (mapBound) return;
    mapBound = true;
    const svg = $('mapSvg');
    let dragging = false, moved = 0, sx = 0, sy = 0;

    const toView = e => {
      const r = svg.getBoundingClientRect();
      return { x: (e.clientX - r.left) * MW / r.width, y: (e.clientY - r.top) * MH / r.height };
    };
    const applyPan = () => {
      const g = $('panLayer');
      if (g) g.setAttribute('transform',
        `translate(${-(BW / 2 - MW / 2 + mapState.offX)} ${-(BH / 2 - MH / 2 + mapState.offY)})`);
    };
    svg.addEventListener('pointerdown', e => {
      dragging = true; moved = 0; sx = e.clientX; sy = e.clientY;
      svg.setPointerCapture(e.pointerId);
      svg.classList.add('grabbing');
    });
    svg.addEventListener('pointermove', e => {
      if (!dragging) return;
      const r = svg.getBoundingClientRect();
      const dx = (e.clientX - sx) * MW / r.width, dy = (e.clientY - sy) * MH / r.height;
      moved += Math.abs(dx) + Math.abs(dy);
      mapState.offX = Math.max(0, Math.min(BW - MW, mapState.offX - dx));
      mapState.offY = Math.max(0, Math.min(BH - MH, mapState.offY - dy));
      sx = e.clientX; sy = e.clientY;
      applyPan();
    });
    svg.addEventListener('pointerup', e => {
      dragging = false;
      svg.classList.remove('grabbing');
      if (moved < 6) {   // 视为点选：命中淡色景点 → 加入今天
        const v = toView(e);
        const bx = v.x + (BW / 2 - MW / 2) + mapState.offX;
        const by = v.y + (BH / 2 - MH / 2) + mapState.offY;
        const dp = route.dayPlans[cur];
        const inRoute = new Set(route.__stops[cur].map(s => s.id));
        let best = null, bd = 16 * 16;
        for (const s of spots) {
          if (inRoute.has(s.id) || !s.coord || !mapState.proj) continue;
          const q = mapState.proj({ lng: s.coord[0], lat: s.coord[1] });
          const dd = (q.x - bx) ** 2 + (q.y - by) ** 2;
          if (dd < bd) { bd = dd; best = s; }
        }
        if (best) confirmAddStop(best, dp);
      }
    });
    $('zoomIn').onclick = () => zoomBy(1);
    $('zoomOut').onclick = () => zoomBy(-1);
  }

  async function zoomBy(dz) {
    if (mapBusy) return;
    const z = Math.max(9, Math.min(15, mapState.zoom + dz));
    if (z === mapState.zoom) return;
    mapState.zoom = z;
    mapBusy = true;
    try {
      const j = await DDN.cloudPost('posterImg', {
        center: `${mapState.cLat.toFixed(6)},${mapState.cLng.toFixed(6)}`,
        zoom: z, size: `${BW}x${BH}`, scale: 1,
      }, 15000);
      const img = await new Promise((res, rej) => {
        const im = new Image();
        im.onload = () => res(im); im.onerror = rej;
        im.src = 'data:image/png;base64,' + j.base64;
      });
      mapState.baseURI = img.src;
      mapState.proj = DDN.mercatorProjector(mapState.cLng, mapState.cLat, z, BW, BH);
    } catch (e) { /* 保持现状 */ }
    mapBusy = false;
    renderMap();
  }

  // 点选确认：加入当天行程（retimeDay 全量重校验）
  function confirmAddStop(spot, dp) {
    DDN.openDrawer('加入今天', (body, close) => {
      const item = DDN.el('div', 'drawer-sub');
      item.textContent = `把「${spot.name}」加到 D${dp.day}（${DDN.themeOf(dp.label)}）的末尾？时间轴会自动重排校验。`;
      body.appendChild(item);
      if (spot.photo) {
        const im = DDN.el('img', 'drawer-photo');
        im.src = spot.photo; im.alt = spot.name; im.referrerPolicy = 'no-referrer';
        body.appendChild(im);
      }
      const dfacts = [];
      if (typeof spot.rating === 'number' && spot.rating > 0) dfacts.push('评分 ' + spot.rating);
      if (spot.open) dfacts.push('营业 ' + (spot.open === '00:00-23:59' ? '24 小时' : spot.open));
      if (spot.tel) dfacts.push('电话 ' + String(spot.tel).split(';')[0]);
      if (spot.open_text) dfacts.push(spot.open_text);
      if (spot && spot.a_level) dfacts.unshift(String(spot.a_level).toUpperCase() + ' 景区');
    if (dfacts.length) body.appendChild(DDN.el('div', 'stop-facts', dfacts.join(' · ')));
      const go = DDN.el('button', 'btn-primary');
      go.textContent = '加入今天';
      go.style.marginTop = '10px';
      go.onclick = async () => {
        close();
        route.__stops[cur].push(spot);
        await applyRetime(cur);
        renderMap();
        DDN.toast(`已加入「${spot.name}」`);

  // ---------- 时间轴 ----------
  function tTime(time, sub) {
    const d = DDN.el('div', 't-time');
    if (time) {
      d.appendChild(DDN.el('b', null, time));
      d.appendChild(DDN.el('span', null, sub));
    }
    return d;
  }
  function tNode(kind, color) {
    const d = DDN.el('div', 't-node');
    const i = DDN.el('i', kind === 'ink' ? 'ink' : (kind === 'tiny' ? 'tiny' : ''));
    if (kind === 'dot' && color) i.style.borderColor = color;
    d.appendChild(i);
    return d;
  }
  function commuteRow(item, nextTarget) {
    const wrap = DDN.el('div', 't-item');
    wrap.appendChild(tTime());
    wrap.appendChild(tNode('tiny'));
    const body = DDN.el('div', 't-body');
    body.style.borderBottom = 'none';
    body.style.padding = '0 0 4px';
    const c = DDN.el('div', 'commute');
    c.appendChild(DDN.icon(item.mode === 'walk' ? 'walk' : (item.mode === 'drive' ? 'drive' : 'transit'), 'ic'));
    const txt = DDN.el('div', 'txt');
    const label = item.label || '';
    txt.appendChild(DDN.el('b', null, label));
    txt.appendChild(document.createTextNode(String(item.text || '').slice(label.length)));
    c.appendChild(txt);

    goBtn.onclick = () => openNavigation(nextTarget);
    c.appendChild(goBtn);
    body.appendChild(c);

    return wrap;

  function endpointRow(item, isStart) {
    const wrap = DDN.el('div', 't-item');
    wrap.appendChild(tTime(item.time, isStart ? '出发' : '返回'));
    wrap.appendChild(tNode('ink'));
    const body = DDN.el('div', 't-body endpoint');
    body.appendChild(DDN.el('b', null, item.name));
    body.appendChild(DDN.el('span', null, item.sub));
    wrap.appendChild(body);
    return wrap;
  }
  function mealRow(item) {
    const wrap = DDN.el('div', 't-item');
    wrap.appendChild(tTime(item.time, item.kind === 'lunch' ? '午餐' : '晚餐'));
    wrap.appendChild(tNode('tiny'));

    body.appendChild(name);

  function durOptions(base) {
    const raw = [base - 30, base, base + 30, base + 60]
      .filter(v => v >= 30 && v <= 480);
    return [...new Set(raw)];
  }

  function stopRow(item, idx, dp) {
    const wrap = DDN.el('div', 't-item');
    wrap.appendChild(tTime(item.arr, '到达'));
    wrap.appendChild(tNode('dot', dp.color));
    const body = DDN.el('div', 't-body');

    const name = DDN.el('div', 'stop-name');
    name.appendChild(document.createTextNode(item.name));
    const isCustom = String(item.id).indexOf('custom_') === 0;   // 用户从地图搜索加入的站点
    if (isCustom) name.appendChild(DDN.el('span', 'stop-flag-custom', '你添加的'));
    if (item.flag) {
      name.appendChild(DDN.el('span', 'flag' + (item.flagTone === 'mint' ? ' mint' : ''), item.flag));
    }
    const spot = spotById(item.id);
    if (spot && spot.a_level) name.appendChild(DDN.el('span', 'stop-alevel', String(spot.a_level).toUpperCase() + ' 景区'));
    body.appendChild(name);
    // 缩略图（高德首图）：加载失败回退类目占位，点了打开轻详情
    if (spot && spot.photo) {
      const holder = DDN.el('div', 'stop-thumb');
      const im = DDN.el('img');
      im.src = spot.photo;
      im.alt = '';
      im.loading = 'lazy';
      im.decoding = 'async';
      im.referrerPolicy = 'no-referrer';
      im.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:8px;display:block';
      im.onerror = () => { im.remove(); holder.className = 'stop-thumb ph'; holder.textContent = String(spot.cat || '景').slice(0, 1); };
      holder.appendChild(im);
      holder.onclick = () => openSpotSheet(spot);
      body.appendChild(holder);
    }
    if (spot) {
      name.style.cursor = 'pointer';
      name.onclick = () => openSpotSheet(spot);
    }
    const tags = spot ? [spot.cat, ...(spot.tags || [])].slice(0, 3).join(' · ') : item.cat;
    body.appendChild(DDN.el('div', 'stop-tags', tags));
    // 事实行：评分 / 营业时间 / 电话（来自高德 POI 回填；缺哪项就省哪项）
    if (spot) {
      const facts = [];
      if (typeof spot.rating === 'number' && spot.rating > 0) facts.push('评分 ' + spot.rating);
      if (spot.open) facts.push('营业 ' + (spot.open === '00:00-23:59' ? '24 小时' : spot.open));
      if (spot.tel) facts.push('电话 ' + String(spot.tel).split(';')[0]);
      if (facts.length) body.appendChild(DDN.el('div', 'stop-facts', facts.join(' · ')));
    }

    if (item.reason) body.appendChild(DDN.el('p', 'stop-reason', item.reason));
    if (item.notice) body.appendChild(DDN.el('div', 'notice', item.notice));

    // 编辑操作收进 card-edit，默认收起（浏览态只读；展开后才出现时长档与排序/删除）
    const editWrap = DDN.el('div', 'card-edit');
    const toggle = DDN.el('button', 'card-toggle', '编辑这一站');
    toggle.onclick = () => {
      const expanded = body.classList.toggle('expanded');
      toggle.textContent = expanded ? '收起' : '编辑这一站';
    };
    body.appendChild(toggle);
    body.appendChild(editWrap);

    // dur-row：以该站当前 dur 为基准的时长档位（自定义站点同样可调）
    const selfSpot = isCustom ? (route.__stops[cur] || []).find(s => s.id === item.id) : null;
    if (spot || selfSpot) {
      const baseDur = spot ? (spot.dur || 90) : (selfSpot.dur || 60);
      const row = DDN.el('div', 'dur-row');
      const durLabel = DDN.el('span', 'dur-label', '游玩时长');
      durLabel.title = '点选可调整这一站的停留时间，时间轴会自动重排';
      row.appendChild(durLabel);
      for (const v of durOptions(baseDur)) {
        const s = DDN.el('span', v === baseDur ? 'on' : '', DDN.fmtDur(v));
        s.onclick = () => {
          if (v === baseDur) return;
          if (spot) spot.dur = v; else selfSpot.dur = v;
          applyRetime(cur);
        };
        row.appendChild(s);
      }
      editWrap.appendChild(row);
    }

    const clock = DDN.el('div', 'stop-clock');
    clock.appendChild(DDN.icon('clock', 'ic'));
    clock.appendChild(document.createTextNode(`${item.arr} 到达 · 游览至 ${item.dep}（${DDN.fmtHourCn(item.dur)}）`));
    body.insertBefore(clock, toggle);

    // edit-bar
    const bar = DDN.el('div', 'edit-bar');
    const stops = route.__stops[cur];
    const up = DDN.el('button', null, '上移');
    up.disabled = idx === 0;
    up.onclick = () => {
      const a = route.__stops[cur];
      [a[idx - 1], a[idx]] = [a[idx], a[idx - 1]];
      applyRetime(cur);
    };
    const down = DDN.el('button', null, '下移');
    down.disabled = idx === stops.length - 1;
    down.onclick = () => {
      const a = route.__stops[cur];
      [a[idx], a[idx + 1]] = [a[idx + 1], a[idx]];
      applyRetime(cur);
    };
    const swap = DDN.el('button', null, '换一站');
    swap.onclick = () => openSwap(idx);
    const moveDay = DDN.el('button', null, '移到另天');
    if (route.days < 2) moveDay.disabled = true;
    moveDay.onclick = () => openMoveDay(idx);
    const del = DDN.el('button', 'danger', '删除');
    del.onclick = () => {
      const removed = route.__stops[cur].splice(idx, 1)[0];
      applyRetime(cur);
      if (removed) {
        DDN.toast('已移除「' + removed.name + '」', {
          label: '撤销',
          run: () => { route.__stops[cur].splice(Math.min(idx, route.__stops[cur].length), 0, removed); applyRetime(cur); },
        });
      }
    };
    bar.append(up, down, swap, moveDay, del);
    editWrap.appendChild(bar);

    wrap.appendChild(body);
    return wrap;
  }

  // 去这里：唤起第三方地图 App（目的地用库内同一景点的名称与坐标，保证与展示一致），装不上则回退网页版
  function openNavigation(target) {
    if (!target || !target.coord) { DDN.toast('这个地点没有坐标'); return; }
    const lng = +target.coord[0], lat = +target.coord[1];

    DDN.openDrawer('导航到「' + name + '」', (body, close) => {
      body.appendChild(DDN.el('div', 'drawer-sub', '用第三方地图打开，目的地与站内一致。'));
      const rowWrap = DDN.el('div', 'nav-actions');
      const amap = DDN.el('button', 'nav-btn', '用高德地图');
      amap.onclick = () => {
        close();
        launchNav(
          'amapuri://route/plan/?dlat=' + lat + '&dlon=' + lng + '&dname=' + encodeURIComponent(name) + '&dev=0&t=0',
          'https://uri.amap.com/route/plan?to=' + lng + ',' + lat + '&toname=' + encodeURIComponent(name) + '&src=ddlt&coordinate=gaode&callnative=1'
        );
      };
      const tx = DDN.el('button', 'nav-btn', '用腾讯地图');
      tx.onclick = () => {
        close();
        launchNav(
          'qqmap://map/routeplan?type=drive&to=' + encodeURIComponent(name) + '&tocoord=' + lat + ',' + lng + '&referer=ddlt',
          'https://apis.map.qq.com/uri/v1/routeplan?type=drive&to=' + encodeURIComponent(name) + '&tocoord=' + lat + ',' + lng + '&referer=ddlt'
        );
      };
      rowWrap.append(amap, tx);
      body.appendChild(rowWrap);
    });

  // 先尝试 App scheme；1.5s 内页面未被切走（App 未安装）则回退网页版
  function launchNav(appUrl, webUrl) {
    let left = false;
    const onVis = () => { if (document.hidden) left = true; };
    document.addEventListener('visibilitychange', onVis);
    setTimeout(() => {
      document.removeEventListener('visibilitychange', onVis);
      if (!left && !document.hidden) window.location.href = webUrl;
    }, 1500);
    try { window.location.href = appUrl; } catch (e) { window.location.href = webUrl; }
  }

  // 轻详情抽屉：多图轮播 + 地址 + 事实信息 + 去这里（浏览态也能看，数据已在库）
  function openSpotSheet(spot) {
    if (!spot) return;
    DDN.openDrawer(spot.name, (body, close) => {
      const photos = (spot.photos && spot.photos.length ? spot.photos : (spot.photo ? [spot.photo] : [])).slice(0, 3);

  // 时间轴左右滑动切天（吸顶 tab 的补充手势）
  (function bindSwipe() {
    const tl = $('timeline');
    let sx = 0, sy = 0, tracking = false;
    tl.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) return;
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
    }, { passive: true });
    tl.addEventListener('touchend', e => {
      if (!tracking) return;
      tracking = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
      const next = cur + (dx < 0 ? 1 : -1);
      if (next < 0 || next >= route.dayPlans.length) return;
      cur = next;
      renderDay(); renderMap();
    }, { passive: true });
  })();

  function renderTimeline() {
    const box = $('timeline');
    box.textContent = '';
    const dp = route.dayPlans[cur];
    const seen = { stop: 0 };
    for (const item of dp.items) {
      if (item.type === 'start') box.appendChild(endpointRow(item, true));
      else if (item.type === 'end') box.appendChild(endpointRow(item, false));
      else if (item.type === 'commute') {
      const later = dp.items.slice(dp.items.indexOf(item) + 1).find(x => x.type === 'stop');
      const sp = later ? (spotById(later.id) || null) : null;
      const target = sp ? { name: sp.name, coord: sp.coord } : (later && later.coord ? { name: later.name, coord: [later.coord.lng, later.coord.lat] } : null);
      box.appendChild(commuteRow(item, target));
    }
      else if (item.type === 'meal') box.appendChild(mealRow(item));
      else if (item.type === 'stop') box.appendChild(stopRow(item, seen.stop++, dp));
    }
    // 被挤掉的站
    const dn = $('droppedNote');
    dn.textContent = '';
    if (dp.dropped && dp.dropped.length) {
      dn.hidden = false;
      dn.textContent = '✂ 未排入：' + dp.dropped.map(x => `${x.spot.name}（${x.cause}）`).join('、');
    } else {
      dn.hidden = true;
    }
  }

  // ---------- 微调动作 ----------
  async function applyRetime(i) {
    await DDN.retime(route, i);
    DDN.saveRoute(route);
    renderDay();
    renderAnchor();
  }
  function openSwap(idx) {
    const used = new Set(route.__stops.flat().map(s => s.id));
    const candidates = spots.filter(s => !used.has(s.id))
      .sort((a, b) => b.heat - a.heat).slice(0, 24);
    DDN.openDrawer('换一站', (body, close) => {
      // 攻略文本提取（P6）：AI 只在真实 POI 池匹配，失败/幻觉静默丢弃
      const paste = DDN.el('textarea', 'paste-box');
      paste.placeholder = '粘贴攻略文本，AI 帮你提取其中的地点…';
      paste.maxLength = 500;
      const pasteBtn = DDN.el('button', 'paste-btn', '提取地点');
      body.appendChild(paste);
      body.appendChild(pasteBtn);

      const listBox = DDN.el('div');
      body.appendChild(listBox);
      function renderList(list, pinNote) {
        listBox.textContent = '';
        if (!list.length) {
          listBox.appendChild(DDN.el('div', 'drawer-sub', '本城暂无可替换的站点'));
          return;
        }
        for (const c of list) {
          const item = DDN.el('button', 'drawer-item');
          item.appendChild(DDN.el('span', 'n', c.name));
          item.appendChild(DDN.el('span', 'g', [c.cat, (c.tags || [])[0]].filter(Boolean).join(' · ')));
          item.onclick = () => {
            route.__stops[cur][idx] = c;
            close();
            applyRetime(cur);
          };
          listBox.appendChild(item);
        }
      }
      renderList(candidates);

      pasteBtn.onclick = async () => {
        const text = paste.value.trim();
        if (!text) return;
        pasteBtn.disabled = true;
        pasteBtn.textContent = '提取中…';
        try {
          const j = await DDN.cloudPost('aiCopy', { kind: 'extract', city: route.city, text }, 5000);
          const hit = (j.spotIds || []).map(id => spots.find(s => s.id === id)).filter(Boolean);
          if (hit.length) {
            const rest = candidates.filter(c => !hit.includes(c));
            renderList([...hit, ...rest], true);
            DDN.toast(`从攻略里认出 ${hit.length} 个地点，已置顶`);
          } else {
            DDN.toast('没认出库内地点，换个说法试试');
          }
        } catch (e) {
          DDN.toast('提取暂不可用，列表不受影响');
        }
        pasteBtn.disabled = false;
        pasteBtn.textContent = '提取地点';
      };
    });
  }
  // 「信息有误」：只写 feedback 集合（不公开、不在页面展示，不属于 UGC 发布）；
  // routeId 只在符合 32 位 hex 口径时才带上，本地生成的路线不带（与 routeGet 同一校验）
  function openFeedback(spot, item) {
    const name = spot ? spot.name : item.name;
    DDN.openDrawer('信息有误 · ' + name, (body, close) => {
      body.appendChild(DDN.el('div', 'drawer-sub', '哪里不对？名称、坐标、营业时间、简介都可以说'));
      const ta = DDN.el('textarea', 'paste-box');
      ta.placeholder = '例如：这家博物馆周一其实不闭馆';
      ta.maxLength = 500;
      const btn = DDN.el('button', 'paste-btn', '提交');
      btn.onclick = async () => {
        const text = ta.value.trim();
        if (!text) { DDN.toast('先写两句再提交'); return; }
        btn.disabled = true;
        btn.textContent = '提交中…';
        try {
          await DDN.cloudPost('feedback', {
            spotId: (spot && spot.id) || item.id || null,
            routeId: /^[0-9a-f]{32}$/.test(route.routeId || '') ? route.routeId : null,
            text,
          }, 6000);
          close();
          DDN.toast('已收到，谢谢纠错');
        } catch (e) {
          btn.disabled = false;
          btn.textContent = '提交';
          DDN.toast((e && e.message) || '提交失败，稍后再试');
        }
      };

    });
  }
  function openMoveDay(idx) {
    DDN.openDrawer('移到另一天', (body, close) => {
      route.dayPlans.forEach((dp, i) => {
        if (i === cur) return;
        const item = DDN.el('button', 'drawer-item');
        item.appendChild(DDN.el('span', 'n', `D${dp.day} · ${DDN.themeOf(dp.label)}`));
        item.appendChild(DDN.el('span', 'g', `${dp.date.slice(5).replace('-', '/')} · ${dp.stats.stops} 站`));
        item.onclick = async () => {
          const s = route.__stops[cur].splice(idx, 1)[0];
          route.__stops[i].push(s);
          close();
          await DDN.retime(route, cur);
          await DDN.retime(route, i);
          DDN.saveRoute(route);
          renderDay();
          DDN.toast(`已移到 D${dp.day}`);
        };
        body.appendChild(item);
      });
    });
  }

  // ---------- 汇总渲染 ----------

  // ---------- 编辑旅途：全屏选点模式 ----------
  // 规划视图只显示当天路线与站点；进入编辑后展示全库景点，点淡点加入、点绿点移出，
  // 完成后统一 retimeDay 重校验（真实通勤），路线按真实路网重绘
  // ---------- 编辑旅途：两级搜索（精选库 + 地图地点）与自定义站点 ----------
  // 库内景点走「精选」：点击 = 加入/移出今天；库里没有的地点用地图地点补，作为「自定义站点」加入。
  // 自定义站点不写回库、不进「换一站」候选、AI 文案不为其生成，只是本次行程的一站。
  const esInput = $('editSearchInput'), esPanel = $('editSearch'), esResults = $('editResults');
  let esTimer = null, esSeq = 0;

  // 地图 POI 类目 → 我们的 11 类；默认「街区」（中性，不会误入夜景压尾槽）
  function mapCatOf(poi) {
    const t = [poi.category, poi.title, poi.address].filter(Boolean).join(' ');
    if (/夜景|剧院|演出|音乐厅|剧场/.test(t)) return '夜景';
    if (/博物馆|美术馆|展览馆|纪念馆|科技馆/.test(t)) return '博物馆';
    if (/古镇|古街|老街/.test(t)) return '古镇';
    if (/公园|植物园|动物园|湿地|风景名胜|景区/.test(t)) return '山水';
    if (/美食|小吃|餐饮|夜市|茶馆/.test(t)) return '美食';
    if (/购物|商场|商业|商圈|步行街|街区/.test(t)) return '街区';
    return '街区';
  }
  const inToday = id => (route.__stops[cur] || []).some(s => s.id === id);
  const customByName = name => (route.__stops[cur] || []).find(s => s.custom && s.name === name);

  function customStopFromPoi(poi) {
    return {
      id: 'custom_' + Date.now().toString(36) + Math.floor(Math.random() * 1000).toString(36),
      name: String(poi.title || '自定义地点').slice(0, 30),
      custom: true, coord: [+poi.lng, +poi.lat], cat: mapCatOf(poi), tags: [],
      heat: 6, dur: 60, intro: '', reason: poi.address || '',
      open: null, closed_mon: null, suburb: false,
    };
  }
  function esRow({ name, sub, on, onClick }) {
    const b = DDN.el('button', 'es-item' + (on ? ' on' : ''));
    const box = DDN.el('div');
    box.style.flex = '1'; box.style.minWidth = '0';
    box.appendChild(DDN.el('div', 'n', name));
    if (sub) box.appendChild(DDN.el('div', 'g', sub));
    b.appendChild(box);
    b.appendChild(DDN.el('span', 'st', on ? '已在今天' : '加入'));
    b.onclick = onClick;
    return b;
  }
  function toggleLocalSpot(s) {
    const arr = route.__stops[cur];
    const i = arr.findIndex(x => x.id === s.id);
    if (i >= 0) { arr.splice(i, 1); DDN.toast(`已移出「${s.name}」`); }
    else { arr.push(s); DDN.toast(`已加入「${s.name}」，完成后重排`); }
    renderMap(true);
    runEditSearch(esInput.value.trim());
  }
  function toggleCustomStop(poi) {
    const exist = customByName(poi.title);
    if (exist) {
      route.__stops[cur] = route.__stops[cur].filter(s => s !== exist);
      DDN.toast(`已移出「${exist.name}」`);
    } else {
      const stop = customStopFromPoi(poi);
      route.__stops[cur].push(stop);
      DDN.toast(`已加入「${stop.name}」（自定义站点）`);
    }
    renderMap(true);
    runEditSearch(esInput.value.trim());
  }
  // 结果渲染：库内（精选）在前、地图地点在后
  function paintSearchResults(local, cloudList, pending) {
    // 守卫：搜索是异步的，退出编辑后到达的结果不能把面板重新显示出来
    if (!editMode) return;
    esResults.textContent = '';
    if (!local.length && !cloudList.length) {
      esResults.hidden = false;
      esResults.appendChild(DDN.el('div', 'es-empty',
        pending ? '库内没有…正在搜地图上的地点' : '没找到。换个说法试试，或直接点地图上的圆点。'));
      return;
    }
    if (local.length) {
      esResults.appendChild(DDN.el('div', 'es-group', '精选 · 库内景点'));
      for (const s of local) {
        esResults.appendChild(esRow({
          name: s.name,
          sub: [s.cat, (s.tags || [])[0]].filter(Boolean).join(' · '),
          on: inToday(s.id),
          onClick: () => toggleLocalSpot(s),
        }));
      }
    }
    if (cloudList.length) {
      esResults.appendChild(DDN.el('div', 'es-group', '地图地点 · 作为自定义站点加入'));
      for (const d of cloudList) {
        esResults.appendChild(esRow({
          name: d.title,
          sub: [mapCatOf(d), d.district || d.address || ''].filter(Boolean).join(' · '),
          on: !!customByName(d.title),
          onClick: () => toggleCustomStop(d),
        }));
      }
    }
    esResults.hidden = false;
  }
  async function runEditSearch(q) {
    const seq = ++esSeq;
    const kw = String(q || '').trim();
    if (!kw) { esResults.hidden = true; esResults.textContent = ''; return; }
    const local = spots.filter(s => s.name.includes(kw) || (s.cat || '').includes(kw)
      || (s.tags || []).some(t => String(t).includes(kw))).slice(0, 6);
    // 库内结果**立即**渲染（零延迟）；地图结果再补——否则云端冷启动时面板会空 2~3 秒
    paintSearchResults(local, [], true);
    if (kw.length < 2 || !DDN.cloudAvailable()) return;
    try {
      const j = await DDN.cloudPost('searchPoi', { keyword: kw, region: route.city }, 4000);
      if (seq !== esSeq) return;                   // 输入已变，丢弃过期结果
      const cloudList = (j.data || []).filter(d => !local.some(s => s.name === d.title)).slice(0, 6);
      paintSearchResults(local, cloudList);   // 即使为空也重绘：把「搜索中」换成「没找到」
    } catch (e) { /* 静默：断网时只给库内结果 */ }
  }
  esInput.addEventListener('input', () => {
    clearTimeout(esTimer);
    const q = esInput.value.trim();
    esTimer = setTimeout(() => runEditSearch(q), 260);
  });
  esInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { clearTimeout(esTimer); runEditSearch(esInput.value.trim()); }
  });
  $('editSearchClose').onclick = () => {
    esPanel.hidden = true; esResults.hidden = true; esInput.value = ''; esInput.blur();
  };

  function setHint() {
    if (editMode) {
      document.querySelector('.map-hint').textContent = '搜索或点圆点加减景点 · 完成后生成贴路路线';
      return;
    }
    // 规划模式默认只给「起点周边 6km」（glmap 的 PLAN_VIEW_RADIUS_KM）：远郊日目的地会落在画面外，
    // 这里明说一句，避免用户以为站点丢了
    const R = 6;
    const dp = route.dayPlans[cur];
    const far = !!(dp && dp.items.some(i => i.type === 'stop' && Math.hypot(
      (i.coord.lng - route.origin.lng) * 111.32 * Math.cos(route.origin.lat * Math.PI / 180),
      (i.coord.lat - route.origin.lat) * 111.32) > R));
    document.querySelector('.map-hint').textContent = far
      ? '本日目的地较远，地图只显示起点周边 · 双指缩小可看更远'
      : '「编辑旅途」可加减今天的景点';
  }
  function renderEditDayBar() {
    const bar = $('editDayBar');
    if (!bar) return;
    if (!editMode) { bar.hidden = true; return; }
    bar.hidden = false;
    bar.textContent = '';
    route.dayPlans.forEach((dp, i) => {
      const b = DDN.el('button', 'chip' + (i === cur ? ' on' : ''), 'D' + dp.day);
      b.onclick = () => {
        if (i === cur) return;
        cur = i;
        renderDay(); renderMap(); renderEditDayBar();
      };
      bar.appendChild(b);
    });
    const sum = DDN.el('span', 'sum');
    const dp = route.dayPlans[cur] || {};
    const st = (route.__stops[cur] || []).length;
    const visit = (dp.items || []).filter(i => i.type === 'stop').reduce((n, i) => n + (i.dur || 0), 0);
    sum.textContent = '已选 ' + st + ' 站 · 游览 ' + DDN.fmtHour(visit) + 'h';
    bar.appendChild(sum);
  }
  function toggleSpotEdit(s) {
    const arr = route.__stops[cur];
    const i = arr.findIndex(x => x.id === s.id);
    if (i >= 0) { arr.splice(i, 1); DDN.toast(`已移出「${s.name}」`); }
    else { arr.push(s); DDN.toast(`已加入「${s.name}」，完成后重排`); }
    renderMap(true);   // 保持视野，只重绘标记
    renderEditDayBar();
  }
  $('editBtn').onclick = () => {
    if (!glCtl) return;
    editMode = true;
    $('mapHero').classList.add('fullscreen', 'editing');
    renderEditDayBar();
    document.body.classList.add('map-lock');
    $('editDone').hidden = false;
    $('editSearch').hidden = false;   // 两级搜索：精选库 + 地图地点
    setHint();
    renderMap();
  };
  $('editDone').onclick = async () => {
    editMode = false;
    const barEl = $('editDayBar'); if (barEl) barEl.hidden = true;
    $('editDone').hidden = true;
    $('editSearch').hidden = true;
    $('editResults').hidden = true;
    $('editSearchInput').value = '';
    $('mapHero').classList.remove('fullscreen', 'editing');
    document.body.classList.remove('map-lock');
    setHint();
    await applyRetime(cur);   // 时间轴全量重排校验
    // 自定义站点最容易被"时间排不下"挤掉：明确告知，别让用户以为加了没生效
    const lost = (route.dayPlans[cur].dropped || []).filter(d => d.spot && d.spot.custom);
    if (lost.length) {
      DDN.toast(`${lost.map(d => '「' + d.spot.name + '」').join('、')}没排下：今天时间不够，可先删掉一站再加`);
    }
    renderMap();
  };
  setHint();

  (async () => {
    try { spots = await DDN.loadSpots(route.city || '成都') || []; } catch (e) { spots = []; }
    // 有 GL Key 时优先真实瓦片地图（腾讯 GL），失败回退静态图交互地图
    if (window.DDN_GL_KEY && window.DDNGL) {
      try {
        await DDNGL.load();
        const box = $('glMap');
        box.style.display = 'block';
        $('mapSvg').style.display = 'none';
        const zc = document.querySelector('.map-zoom');
        if (zc) zc.style.display = 'none';   // GL 自带缩放控件
        glCtl = DDNGL.create(box, {
          onSpotTap: s => confirmAddStop(s, route.dayPlans[cur]),
          onSpotToggle: s => toggleSpotEdit(s),
        });
      } catch (e) { glCtl = null; }
    }
    if (!glCtl) $('editBtn').style.display = 'none';   // GL 不可用（回退静态图）时无编辑模式
    renderAnchor();
    renderDay();
    renderNarrative();
    bindMap();
  })();

  // ---------- AI 叙事：只显示在线生成的推荐语，未返回前整行隐藏（降级=不显示，不出错话） ----------
  async function renderNarrative() {
    const box = $('narrative');
    if (!DDN.cloudAvailable()) return;
    try {
      const j = await DDN.cloudPost('aiCopy', {
        kind: 'narrative',
        route: { city: route.city, days: route.days, origin: route.origin, dayPlans: route.dayPlans },
      }, 6500);
      if (j && j.text && !j.fallback) {
        box.textContent = '';
        box.appendChild(document.createTextNode(j.text));
        const tag = DDN.el('span', 'ai-tag', '由 AI 生成');
        box.appendChild(tag);
      }
    } catch (e) { /* 保持隐藏 */ }
  }
})();
</script>
</body>
</html>
