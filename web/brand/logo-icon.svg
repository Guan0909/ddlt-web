<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 点定旅途 · 浅色图标 v7：内缩网格 + 实心墨点（纸白光圈） + 低饱和绿 -->
  <defs>
    <clipPath id="clip"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#FAFBF8"/>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#E3E8E0" stroke-width="2"/>
  <!-- 四条直线网格（内缩，不顶边） -->
  <g stroke="#DFEAE2" stroke-width="3" stroke-linecap="round" clip-path="url(#clip)">
    <path d="M170 70V442M341 70V442"/>
    <path d="M70 170H442M70 341H442"/>
  </g>
  <!-- 主路线：平滑长弧（线宽 16） -->
  <path d="M148 354 C205 358 250 335 282 292 C310 255 322 236 340 218"
        fill="none" stroke="#3B7356" stroke-width="16" stroke-linecap="round"/>
  <!-- 燕尾箭头（恢复 v5 样式，尾翼内收） -->
  <path d="M366 178 L363.9 238.1 L348 206.9 L312.9 206.3 Z"
        fill="#3B7356" stroke="#3B7356" stroke-width="12" stroke-linejoin="round"/>
  <!-- 起点：实心墨点 + 纸白光圈 -->
  <circle cx="148" cy="354" r="12" fill="#182119" stroke="#FAFBF8" stroke-width="5"/>
  <!-- 中途站：同款实心墨点 + 光圈 -->
  <circle cx="282" cy="292" r="11" fill="#182119" stroke="#FAFBF8" stroke-width="5"/>
</svg>
