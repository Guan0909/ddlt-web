<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>点定旅途 · 海报预览</title>
<link rel="icon" type="image/svg+xml" href="../brand/logo-icon.svg">
<link rel="stylesheet" href="assets/style.css">
<style>
  body { background: #101010; }
  .page { background: #101010; display: flex; flex-direction: column; align-items: center; padding: 36px 0 60px; max-width: none; }
  .hint { color: rgba(255,255,255,.42); font-size: 12px; letter-spacing: .18em; margin-bottom: 20px; }

  /* ===== 海报本体 3:4 · 编辑感纸面 ===== */
  .poster {
    width: 340px; aspect-ratio: 3/4;
    background: #FAFBF8;
    border-radius: 6px;
    padding: 22px 24px 14px;
    display: flex; flex-direction: column;
    box-shadow: 0 30px 70px rgba(0,0,0,.55);
    font-family: var(--font);
  }

  .p-head { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 12px; border-bottom: 1px solid #182119; }
  .p-city { font-family: var(--serif); font-size: 36px; font-weight: 700; line-height: 1; color: #182119; }
  .p-city small { display: block; font-family: var(--font); font-size: 8.5px; letter-spacing: .48em; color: #9C998C; margin-top: 6px; font-weight: 600; }
  .p-date { text-align: right; font-size: 10px; color: #6E6A5E; line-height: 1.7; letter-spacing: .05em; }

  /* 真实地图（低饱和）+ 每日一色 */
  .p-mapbox { margin-top: 12px; position: relative; flex: none; height: 224px; border-radius: 4px; overflow: hidden; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18); }
  .p-mapbox svg { display: block; width: 100%; height: 224px; }
  .p-legend {
    position: absolute; left: 8px; top: 8px;
    display: flex; flex-direction: column; gap: 3px;
    background: rgba(251,251,246,.94);
    border-radius: 4px; padding: 6px 9px;
  }
  .p-legend div { display: flex; align-items: center; gap: 5px; font-size: 9px; font-weight: 700; color: #182119; }
  .p-legend i { width: 13px; height: 3px; border-radius: 2px; }
  .p-legend span { color: #8A867A; font-weight: 500; }
  .p-attr { position: absolute; right: 6px; bottom: 5px; font-size: 7px; color: rgba(0,0,0,.45); background: rgba(255,255,255,.75); padding: 1px 4px; border-radius: 2px; }

  /* 三日摘要：发丝线行 */
  .p-days { margin-top: 6px; flex: 1; }
  .p-day { display: flex; align-items: center; gap: 8px; padding: 7.5px 0; border-bottom: .5px solid #E3E8E0; }
  .p-day:last-child { border-bottom: none; }
  .p-day .dnum { font-family: var(--serif); font-size: 12px; font-weight: 700; width: 22px; flex: none; }
  .p-day .route { font-size: 10.5px; font-weight: 600; color: #182119; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-day .km { font-size: 9px; color: #9C998C; flex: none; font-variant-numeric: tabular-nums; }

  .p-stats {
    display: flex; margin-top: 6px; padding: 9px 0 0;
    border-top: 1px solid #182119;
  }
  .p-stats div { flex: 1; text-align: center; }
  .p-stats div + div { border-left: .5px solid #E3E8E0; }
  .p-stats b { font-family: var(--serif); font-size: 15px; display: block; color: #182119; }
  .p-stats span { font-size: 8px; letter-spacing: .18em; color: #9C998C; }

  .p-brand { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 8.5px; color: #9C998C; letter-spacing: .1em; }
  .p-brand b { font-family: var(--serif); color: #182119; font-size: 10px; letter-spacing: .26em; }

  .save-btn {
    margin-top: 26px; display: flex; align-items: center; gap: 8px;
    background: #FAFBF8; color: #182119; font-size: 14px; font-weight: 600; letter-spacing: .06em;
    padding: 14px 36px; border-radius: 999px; box-shadow: 0 12px 32px rgba(0,0,0,.45);
  }
  .tip { color: rgba(255,255,255,.3); font-size: 11px; margin-top: 16px; letter-spacing: .05em; }
</style>
</head>
<body>
<div class="page">
  <p class="hint">海报预览 · 3:4 · 长按可保存</p>

  <div class="poster">
    <div class="p-head">
      <div class="p-city">成都<small>CHENGDU</small></div>
      <div class="p-date">10月9日–11日<br>三日漫游 · 每日环线</div>
    </div>

    <!-- 真实地图底图：原型 OSM 瓦片（低饱和处理），正式版为腾讯静态图 API -->
    <div class="p-mapbox">
      <svg viewBox="68 40 484 356" preserveAspectRatio="xMidYMid slice">
        <g style="filter:grayscale(.72) sepia(.1) contrast(.94) brightness(1.03)">
          <image href="https://tile.openstreetmap.org/12/3231/1680.png" x="0"   y="0"   width="256" height="256"/>
          <image href="https://tile.openstreetmap.org/12/3232/1680.png" x="256" y="0"   width="256" height="256"/>
          <image href="https://tile.openstreetmap.org/12/3233/1680.png" x="512" y="0"   width="256" height="256"/>
          <image href="https://tile.openstreetmap.org/12/3231/1681.png" x="0"   y="256" width="256" height="256"/>
          <image href="https://tile.openstreetmap.org/12/3232/1681.png" x="256" y="256" width="256" height="256"/>
          <image href="https://tile.openstreetmap.org/12/3233/1681.png" x="512" y="256" width="256" height="256"/>
        </g>

        <!-- 路线白色衬底 -->
        <g fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" opacity=".92">
          <path d="M296.8 319.4 L235.9 280.4 L255.1 299.7 L262.4 309.9 L214.3 368.8 L219 370.8"/>
          <path d="M296.8 319.4 L512.6 63.3 L403.1 268.6 L353.6 261.8"/>
          <path d="M296.8 319.4 L155.5 329.5 L190.5 319.4 L111.8 234.7"/>
        </g>
        <!-- D1 赭橙 / D2 青 / D3 紫 -->
        <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.8">
          <path stroke="#3B7356" d="M296.8 319.4 L235.9 280.4 L255.1 299.7 L262.4 309.9 L214.3 368.8 L219 370.8"/>
          <path stroke="#3E8E9E" d="M296.8 319.4 L512.6 63.3 L403.1 268.6 L353.6 261.8"/>
          <path stroke="#B08A3E" d="M296.8 319.4 L155.5 329.5 L190.5 319.4 L111.8 234.7"/>
        </g>

        <!-- 标记 -->
        <g font-family="-apple-system" font-weight="700" text-anchor="middle">
          <circle cx="296.8" cy="319.4" r="9" fill="#182119" stroke="#fff" stroke-width="2.5"/>
          <text x="296.8" y="322.8" font-size="9" fill="#fff">起</text>
          <g fill="#3B7356" stroke="#fff" stroke-width="1.8">
            <circle cx="235.9" cy="280.4" r="5.5"/><circle cx="255.1" cy="299.7" r="5.5"/>
            <circle cx="262.4" cy="309.9" r="5.5"/><circle cx="214.3" cy="368.8" r="5.5"/>
            <circle cx="219"   cy="370.8" r="5.5"/>
          </g>
          <g fill="#3E8E9E" stroke="#fff" stroke-width="1.8">
            <circle cx="512.6" cy="63.3"  r="5.5"/><circle cx="403.1" cy="268.6" r="5.5"/>
            <circle cx="353.6" cy="261.8" r="5.5"/>
          </g>
          <g fill="#B08A3E" stroke="#fff" stroke-width="1.8">
            <circle cx="155.5" cy="329.5" r="5.5"/><circle cx="190.5" cy="319.4" r="5.5"/>
            <circle cx="111.8" cy="234.7" r="5.5"/>
          </g>
        </g>

        <!-- 地名标注 -->
        <g font-family="-apple-system,'PingFang SC'" font-size="10.5" font-weight="700" fill="#182119"
           style="paint-order:stroke;stroke:#FAFBF8;stroke-width:3">
          <text x="505" y="68"  text-anchor="end">大熊猫基地</text>
          <text x="412" y="256" text-anchor="middle">东郊记忆</text>
          <text x="108" y="224" text-anchor="middle">金沙遗址</text>
          <text x="142" y="347" text-anchor="middle">杜甫草堂</text>
          <text x="226" y="270" text-anchor="middle">宽窄巷子</text>
          <text x="206" y="390" text-anchor="middle">武侯祠·锦里</text>
          <text x="310" y="340" text-anchor="middle">春熙路·起点</text>
        </g>
      </svg>
      <div class="p-legend">
        <div><i style="background:#3B7356"></i>D1 <span>城西文化线</span></div>
        <div><i style="background:#3E8E9E"></i>D2 <span>城北熊猫线</span></div>
        <div><i style="background:#B08A3E"></i>D3 <span>西郊遗址线</span></div>
      </div>
      <div class="p-attr">© OpenStreetMap</div>
    </div>

    <div class="p-days">
      <div class="p-day"><span class="dnum" style="color:#3B7356">D1</span><span class="route">宽窄巷子 → 人民公园 → 成博 → 武侯祠 → 锦里</span><span class="km">12.4</span></div>
      <div class="p-day"><span class="dnum" style="color:#3E8E9E">D2</span><span class="route">大熊猫基地 → 东郊记忆 → 建设路小吃街</span><span class="km">28.6</span></div>
      <div class="p-day"><span class="dnum" style="color:#B08A3E">D3</span><span class="route">杜甫草堂 → 青羊宫 → 金沙遗址博物馆</span><span class="km">15.8</span></div>
    </div>

    <div class="p-stats">
      <div><b>3</b><span>天</span></div>
      <div><b>11</b><span>站点</span></div>
      <div><b>56.8</b><span>公里</span></div>
      <div><b>19h</b><span>游览</span></div>
    </div>

    <div class="p-brand">
      <b>点定旅途</b>
      <span>从任何地点 · 生成你的路线</span>
    </div>
  </div>

  <button class="save-btn">
    <svg class="ic" viewBox="0 0 24 24"><path d="M12 4v12M6.5 10.5 12 16l5.5-5.5"/><path d="M4 20h16"/></svg>
    保存图片
  </button>
  <p class="tip">正式版底图为腾讯静态图 API · 每天一条配色路线 · 无二维码全平台合规</p>
</div>
</body>
</html>
